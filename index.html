<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Life</title>
<meta name="theme-color" content="#FFFEFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<!-- Les scripts sont chargés en bas de page : l'écran d'ouverture s'affiche tout de suite, sans page blanche. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Polices chargées sans bloquer l'affichage (police système en attendant). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout : une colonne centrée (max 760px), verre dépoli clair sur taches pastel (palette de Tania), barre d'onglets en bas avec Home mis en avant. Mode clair uniquement. */
:root{
  --paper:#FFFEFB; --white:#FFFFFF; --cream:#FFECCD; --pink:#FCD9F7; --grey:#E3E2E2; --cyan:#CAFAFF;
  --ink:#2B2633; --muted:#6B6573; --line:rgba(43,38,51,.12); --soft:rgba(43,38,51,.06);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.94); --glass-edge:rgba(255,255,255,.9);
  --accent:#2B2633; --accent-ink:#FFFEFB; --ok:#2E7D57; --warn:#A4521B;
  --r-card:10px; --r-btn:8px; --r-chip:6px;
  --shadow:0 6px 24px rgba(43,38,51,.08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
/* Écran fixe façon appli : pas de zoom (pincer ou double-toucher), petit rebond en haut et en bas, pas de glissement de côté, barre de défilement cachée (on fait toujours défiler au doigt). */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-x:none;scrollbar-width:none;touch-action:pan-y}
body{overscroll-behavior-x:none;touch-action:pan-y}
/* Rien ne dépasse sur le côté (les tâches ne glissent plus), et la page est toujours un tout petit peu plus haute que l’écran pour garder le rebond partout. */
#app{overflow-x:clip;min-height:calc(100vh + 1px);min-height:calc(100dvh + 1px)}
.tcard,.list-item,.card{max-width:100%;min-width:0}
html::-webkit-scrollbar,body::-webkit-scrollbar,#sheet .panel::-webkit-scrollbar{display:none;width:0;height:0}
#sheet .panel{scrollbar-width:none;overscroll-behavior:contain}
button,a,label,input,select,textarea{touch-action:manipulation}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px)}
.bg i:nth-child(1){width:48vmax;height:48vmax;background:var(--cream);top:-16vmax;left:-14vmax}
.bg i:nth-child(2){width:40vmax;height:40vmax;background:var(--pink);top:8vmax;right:-16vmax}
.bg i:nth-child(3){width:40vmax;height:40vmax;background:var(--cyan);bottom:-16vmax;left:4vmax}
.bg i:nth-child(4){width:24vmax;height:24vmax;background:var(--grey);bottom:18vmax;right:8vmax;opacity:.7}
/* Écran d'ouverture : orbe pastel qui tourne et respire, nom de l'appli, message qui patiente. */
.splash{min-height:calc(100vh - 170px);min-height:calc(100dvh - 170px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;animation:spIn .6s ease both}
.sp-orb{position:relative;width:104px;height:104px;animation:spBreath 2.6s ease-in-out infinite}
.sp-orb i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#FFD9A8,#F9BDEF,#A8EEF6,#B8D6FF,#C4EFB8,#FFD9A8);box-shadow:0 12px 44px rgba(43,38,51,.14);animation:spSpin 3.6s linear infinite}
.sp-orb::after{content:"";position:absolute;inset:20px;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:inset 0 1px 6px rgba(43,38,51,.08)}
.sp-orb b{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font:700 1.25rem/1 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif;color:#2B2633;letter-spacing:-.02em}
.sp-msg{margin:0;color:#6B6573;font-size:.95rem;font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif}
.sp-dots b{display:inline-block;animation:spDot 1.2s ease-in-out infinite}
.sp-dots b:nth-child(2){animation-delay:.15s}.sp-dots b:nth-child(3){animation-delay:.3s}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spDot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes spIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.05}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--glass-edge);border-radius:var(--r-card);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:0;border-radius:var(--r-btn);padding:9px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.soft{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.85rem}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:var(--r-btn);display:grid;place-items:center;color:var(--muted);font-size:1.1rem;flex:none}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-chip);background:var(--c,var(--grey));color:var(--ink);font-size:.78rem;font-weight:600;white-space:nowrap}
.etile{flex:none;width:34px;height:34px;border-radius:var(--r-btn);display:grid;place-items:center;background:var(--c,var(--grey));font-size:1.05rem}
.tag-ex{font-size:.7rem;padding:1px 6px;border-radius:var(--r-chip);border:1px dashed var(--muted);color:var(--muted)}

/* En-tête Home */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.7rem;letter-spacing:-.02em}
.logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,var(--cream),var(--pink),var(--cyan),var(--cream));border:1px solid var(--line)}
.progress{height:10px;border-radius:5px;background:var(--grey);overflow:hidden}
.progress b{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#f7c58a,#f3a6e6,#7fe3ee);transition:width .5s ease}
.stats{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Timeline */
.timeline{display:flex;flex-direction:column;gap:8px}
.tl{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start}
.tl .time{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);padding-top:15px;text-align:right}
.tl.marker .time{padding-top:3px}
.marker-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.82rem;padding:2px 0}
.marker-line::after{content:"";flex:1;height:1px;background:var(--line)}
.tl.now .time,.tl.now .marker-line{color:var(--warn);font-weight:600}
.tl.now .marker-line::after{height:2px;background:var(--warn)}
.late-txt{color:var(--warn);font-weight:600}
.tcard.late{box-shadow:inset 3px 0 0 var(--warn),var(--shadow)}
.tcard{position:relative;display:flex;align-items:center;gap:10px;padding:9px 8px 9px 10px;cursor:pointer;min-width:0}
.tcard .body{flex:1;min-width:0}
.tcard .t{font-weight:600;overflow-wrap:anywhere}
.tcard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:2px}
.tcard.done .t{text-decoration:line-through;color:var(--muted)}
.tcard.done{opacity:.72}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(43,38,51,.35);background:var(--white);display:grid;place-items:center;color:var(--ink);font-size:.85rem;font-weight:700}
.check.on{background:var(--c,var(--cream));border-color:var(--ink)}
.tcard.menu-open{z-index:40}
*:has(> .tcard.menu-open){position:relative;z-index:40}
.menu{position:absolute;right:8px;top:calc(100% - 4px);z-index:5;background:var(--white);border:1px solid var(--line);border-radius:var(--r-btn);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:220px;overflow:hidden}
.menu button{border:0;background:none;text-align:left;padding:10px 14px;font-size:.9rem}
.menu button:hover{background:var(--soft)}
.work{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.work .line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.82rem}
.work .line::before,.work .line::after{content:"";height:1px;flex:1;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.next{grid-template-columns:1fr}}
.next .glass{padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.emos{font-size:.95rem;letter-spacing:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* Listes */
.list-item.subcat{margin-left:28px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-width:0}
.list-item .body{flex:1;min-width:0}
.list-item .t{font-weight:600;overflow-wrap:anywhere}
.sub{margin-left:26px}
.big{font-family:var(--f-display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}

/* Calendrier */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week .day{display:flex;flex-direction:column;gap:5px;padding:8px;min-width:0;min-height:120px}
.week .day.today{outline:2px solid var(--ink);outline-offset:-2px}
.week .it{font-size:.74rem;padding:4px 5px;border-radius:var(--r-chip);background:var(--c,var(--grey));cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week .it.done{opacity:.55;text-decoration:line-through}
@media (max-width:720px){.week{grid-template-columns:1fr}.week .day{min-height:0}.week .it{font-size:.85rem;white-space:normal}}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .h{font-size:.72rem;color:var(--muted);text-align:center;font-weight:600}
.month .cell{aspect-ratio:1/1;max-width:100%;border-radius:var(--r-btn);background:var(--glass);border:1px solid var(--glass-edge);padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;font-variant-numeric:tabular-nums;font-size:.8rem}
.month .cell.out{opacity:.4}
.month .cell.today{outline:2px solid var(--ink);outline-offset:-2px}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c);border:1px solid rgba(43,38,51,.25)}

/* Formulaires */
label.f,.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--white);border-radius:var(--r-btn);padding:9px 11px;font-weight:400;color:var(--ink)}
input[type=file]{font-size:.85rem;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ink)}
/* 16px minimum : en dessous, l’iPhone zoome tout seul quand on touche un champ. */
input,select,textarea{font-size:16px!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.days,.seg,.multi,.presets{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--white);font-weight:600;font-size:.85rem}
.seg button,.multi button,.presets button{border:1px solid var(--line);background:var(--white);border-radius:var(--r-btn);padding:6px 11px;font-size:.85rem}
.days button[aria-pressed="true"],.seg button[aria-pressed="true"],.multi button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:transparent}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:var(--r-btn);border:2px solid var(--line);background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:500;color:var(--ink)}
.toggle input{width:19px;height:19px;accent-color:var(--ink);flex:none}
.compare{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);font-weight:400}
.compare div{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center}
.compare b{font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
.bar{height:6px;border-radius:3px;background:var(--c,var(--grey));border:1px solid rgba(43,38,51,.15)}
.ai-out{white-space:pre-wrap;background:var(--white);border:1px solid var(--line);border-radius:var(--r-btn);padding:12px 14px;font-size:.92rem;overflow-wrap:anywhere}
.thumb{max-width:100%;max-height:220px;border-radius:var(--r-btn);object-fit:cover}
/* Images des tâches : bannière en haut, images pleine largeur dans la description */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ex{background:var(--white);border:1px solid var(--line);border-radius:var(--r-btn);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ex img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.ex .b{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.ex .n{font-weight:600;font-size:.92rem;display:flex;gap:6px;align-items:flex-start}
.ex .num{flex:none;min-width:20px;height:20px;border-radius:10px;background:var(--line);font-size:.75rem;display:inline-flex;align-items:center;justify-content:center}
.ex{cursor:pointer;transition:transform .15s}
.ex:active{transform:scale(.97)}
.exzoom{position:fixed;inset:0;z-index:200;background:rgba(30,25,35,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.exzoom[hidden]{display:none}
.exz-card{position:relative;background:var(--white);border-radius:var(--r-card);box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto}
.exz-card img{display:block;width:100%;max-height:52vh;object-fit:cover;background:var(--line)}
.exz-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.exz-b h2{display:flex;gap:8px;align-items:center;margin:0}
.exz-b .num{flex:none;min-width:28px;height:28px;border-radius:14px;background:var(--line);font-size:.9rem;display:inline-flex;align-items:center;justify-content:center}
.exz-dose{font-weight:600;font-size:1.05rem}
.exz-close{position:absolute;top:8px;right:8px;background:var(--white);z-index:1}
.ex .q{font-size:.85rem}
.ex .tip{font-size:.8rem;color:var(--muted)}
.cover{display:block;width:100%;height:200px;object-fit:cover;border-radius:var(--r-btn);background:var(--line)}
.dimg{display:block;width:100%;height:auto;min-height:60px;border-radius:var(--r-btn);background:var(--line)}
.desc-view{display:flex;flex-direction:column;gap:10px}
.img-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.img-tools input[type=file]{display:none}
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--white);font-weight:400;color:var(--ink);cursor:pointer}
.rule input{margin-top:3px;accent-color:var(--ink)}

/* Barre du bas */
/* Discussion, alertes */
.askbar,.chatbar{display:flex;gap:8px;padding:6px;align-items:center}
.askbar input,.chatbar input{flex:1;min-width:0;border:0;background:transparent;padding:8px 10px}
.askbar input:focus-visible,.chatbar input:focus-visible{outline:none}
.askbar:focus-within,.chatbar:focus-within{outline:2px solid var(--ink);outline-offset:1px}
.chatbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--glass-strong)}
.chat-log{display:flex;flex-direction:column;gap:10px;min-height:30vh}
.msg{display:flex;flex-direction:column;gap:4px;max-width:88%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg .bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 13px;border-radius:var(--r-card);background:var(--white);border:1px solid var(--line)}
.msg.user .bubble{background:var(--ink);color:var(--paper);border-color:transparent}
.msg .acts{font-size:.8rem;color:var(--ok);display:flex;flex-direction:column;gap:2px}
.alert{position:fixed;z-index:60;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 24px));padding:12px 14px;display:flex;gap:10px;align-items:center;background:var(--glass-strong)}
#nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(500px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px;border-radius:14px}
#nav button{border:0;background:transparent;border-radius:var(--r-btn);padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-size:.7rem;font-weight:600;color:var(--muted);gap:2px}
#nav button svg{width:22px;height:22px}
#nav button[aria-current="page"]{color:var(--ink);background:var(--soft)}
#nav .home{background:transparent!important}
#nav .home .orb{width:54px;height:54px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--cream),var(--pink),var(--cyan),var(--cream));border:3px solid var(--white);box-shadow:var(--shadow);font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--ink)}
#nav .home[aria-current="page"] .orb{border-color:var(--ink)}

/* Feuille */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,38,51,.28)}
#sheet .panel{width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;border:1px solid var(--glass-edge)}
@media (min-width:700px){#sheet{align-items:center}#sheet .panel{border-radius:14px}}

/* ---------- Modèle ---------- */
// Le cœur du planning est dans planner.js (partagé avec le service du matin) : ici, on le branche sur l'état de l'appli.

const autoLabel=title=>{const m=detectMoment(title);return m==='any'?'Life choisit le moment':MOMENTS[m].l+' (deviné par Life)'};

function momentBadge(t){const m=momentOf(t);if(m==='any'||t.time)return '';
  return ' · '+MOMENT_ICON[m]+' '+esc(MOMENTS[m].l.toLowerCase())+' <span class="muted">('+(t.moment&&t.moment!=='auto'?'choisi par toi':'deviné par Life')+')</span>'+

// Heure précise qui contredit le moment (ex. « Soirée » à 12:20) et que Tania n'a pas confirmée : Life la retire.
const timeClash=t=>{if(!t.time||t.timeOk)return false;const w=winOf(t),m=toMin(t.time);return m<w[0]||m>=w[1]};
const loadFactor=()=>S.autoLF*(+((S.profile||{}).loadBias)||1);
const generate=(date,o)=>P.generate({tasks:S.tasks,cats:S.cats,profile:S.profile,autoLF:S.autoLF,today:today(),nowMin:nowMin()},date,o);
function futurePlans(upto){
  const out={},used=new Set();let d=today();
  const mark=p=>p.items.forEach(i=>{const t=taskById(i.tid);if(t&&t.type==='once')used.add(i.tid)});
  out[d]=S.plan||generate(d,{fromNow:true});mark(out[d]);
  while(d<upto){d=addDays(d,1);out[d]=generate(d,{exclude:used});mark(out[d])}
  return out;
}
function planOf(date,fp){
  if(date<today()){
    if(S.past[date])return S.past[date];
    const items=S.tasks.filter(t=>t.type==='once'?t.doneDay===date:(t.doneDates||[]).includes(date)).map(t=>({tid:t.id,s:0,e:0}));
    return {date,items,history:true};
  }
  return fp[date]||{date,items:[]};
}
async function computeLoad(){
  try{
    const snap=await plansRef.orderBy('date','desc').limit(8).get();
    let tot=0,done=0;
    snap.docs.map(d=>d.data()).filter(p=>p.date<today()&&Array.isArray(p.items)).forEach(p=>p.items.forEach(i=>{
      const t=taskById(i.tid);if(!t)return;tot++;if(isDone(t,p.date)&&(t.type!=='once'||t.doneDay===p.date))done++;
    }));
    if(tot>=5){S.rate=done/tot;S.autoLF=S.rate>=0.9?1.15:S.rate>=0.7?1:S.rate>=0.5?0.88:0.75}
  }catch(e){}
  S.loadReady=true;
}
async function savePlan(p){await plansRef.doc(p.date).set({date:p.date,items:p.items,skipped:p.skipped||[],at:new Date().toISOString()})}

  if(S.planning||!S.profile||!S.profile.onboarded||!S.catsLoaded||!S.tasksLoaded||!S.planLoaded||!S.loadReady)return;

async function replanToday(silent,fill){
  const d=today(),cur=S.plan||{items:[],skipped:[]};
  const pinned=cur.items.filter(i=>{const t=taskById(i.tid);return t&&isDone(t,d)});
  try{
    const p=generate(d,{pinned,skipped:cur.skipped||[],fromNow:true});await savePlan(p);
    const n=fill?await fillToday(p):0;
    if(!silent)toast(n?'Journée replanifiée, avec '+n+' tâche'+(n>1?'s':'')+' prévue'+(n>1?'s':'')+' plus tard.':'Journée replanifiée.');
    return n;
  }catch(e){toast('Impossible de replanifier. Réessaie dans un instant.');return 0}

// Retire l'heure d'une tâche quand elle contredit le moment deviné ou choisi, puis replanifie.
let fixingClash=false;
async function fixClashes(){
  if(fixingClash||!tasksRef)return;
  const bad=S.tasks.filter(t=>!t.done&&!t.abandoned&&timeClash(t));if(!bad.length)return;
  fixingClash=true;
  try{
    for(const t of bad)await tasksRef.doc(t.id).update({time:null,timeWas:t.time});
    toast(bad.length===1?'« '+bad[0].title+' » à '+bad[0].time+' ne collait pas avec '+MOMENTS[momentOf(bad[0])].l.toLowerCase()+' : Life a retiré cette heure.':bad.length+' heures qui ne collaient pas avec le moment ont été retirées.');
    setTimeout(()=>replanToday(true),400);
  }catch(e){}finally{fixingClash=false}
}
// Retard en minutes d'un élément du planning du jour (0 s'il n'est pas en retard).
const lateBy=(i,d)=>{const t=i.t||taskById(i.tid);if(!t||i.w||t.abandoned||isDone(t,d)||d!==today())return 0;const l=nowMin()-i.s;return l>5?l:0};
// Chaque minute : une tâche sans heure fixe en retard de 15 min ou plus est décalée toute seule, et « Ma journée » se met à l'heure.
let lastAutoReplan=0;
function tick(){
  if(document.hidden||!S.plan||S.plan.date!==today())return;
  const d=today(),late=S.plan.items.filter(i=>{const t=taskById(i.tid);return t&&!t.time&&lateBy(i,d)>=15});
  if(late.length&&Date.now()-lastAutoReplan>10*60000){
    lastAutoReplan=Date.now();const t0=taskById(late[0].tid);
    replanToday(true).then(()=>toast(late.length===1?'« '+t0.title+' » était en retard : Life l’a décalée.':late.length+' tâches en retard décalées par Life.'));return;
  }
  if(S.view==='home'&&$('#sheet').hidden&&!S.menu)render();
}

/* ---------- Stockage Supabase (même interface que la base de la version Claude) ---------- */
const IMG_COLL='life/images';
const SB_URL='https://fycpioedjvrxkpkcyijw.supabase.co',SB_KEY='sb_publishable_2oFOAecr-_j8a_6tygHz1A_dhieFDJH';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const clone=o=>JSON.parse(JSON.stringify(o));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function merge(a,b){const o=Object.assign({},a);Object.keys(b).forEach(k=>{o[k]=isObj(o[k])&&isObj(b[k])?merge(o[k],b[k]):b[k]});return o}
function cmpOp(x,op,v){switch(op){case '==':return x===v;case '!=':return x!==v;case '<':return x<v;case '<=':return x<=v;case '>':return x>v;case '>=':return x>=v;default:return true}}
function makeStore(uid){
  const cache=new Map(),listeners=new Set();
  const C=c=>{if(!cache.has(c))cache.set(c,new Map());return cache.get(c)};
  const snap=(id,d)=>({id,exists:d!==undefined,data:()=>d});
  const emit=coll=>listeners.forEach(l=>{if(l.coll===coll)l.fire()});
  const setLocal=(coll,id,d)=>{if(d===undefined)C(coll).delete(id);else C(coll).set(id,d);emit(coll)};
  const genId=()=>Math.random().toString(36).slice(2,12)+Date.now().toString(36).slice(-6);
  async function write(coll,id,d){setLocal(coll,id,d);const {error}=await sb.from('docs').upsert({user_id:uid,coll,id,data:d,updated_at:new Date().toISOString()});if(error)throw error}
  async function del(coll,id){setLocal(coll,id,undefined);const {error}=await sb.from('docs').delete().eq('user_id',uid).eq('coll',coll).eq('id',id);if(error)throw error}
  function listen(coll,fire){const l={coll,fire};listeners.add(l);setTimeout(fire,0);return ()=>listeners.delete(l)}
  function docRef(coll,id){return {id,path:coll+'/'+id,
    get:async()=>snap(id,C(coll).get(id)),
    set:d=>write(coll,id,clone(d)),
    update:async d=>{const cur=C(coll).get(id);if(cur===undefined)throw {code:'invalid_argument'};return write(coll,id,merge(cur,clone(d)))},
    delete:()=>del(coll,id),
    onSnapshot:cb=>listen(coll,()=>cb(snap(id,C(coll).get(id)))),
    collection:sub=>collRef(coll+'/'+id+'/'+sub)}}
  function query(coll,filters,order,lim){
    const run=()=>{let arr=[...C(coll).entries()].map(e=>({id:e[0],d:e[1]}));
      filters.forEach(f=>{arr=arr.filter(x=>cmpOp(x.d[f[0]],f[1],f[2]))});
      if(order)arr.sort((a,b)=>{const x=a.d[order[0]],y=b.d[order[0]];const r=x==null?1:y==null?-1:x<y?-1:x>y?1:0;return order[1]==='desc'?-r:r});
      else arr.sort((a,b)=>a.id<b.id?-1:1);
      if(lim)arr=arr.slice(0,lim);

  async function load(){

}

/* Déplace une fois les données de l'espace privé (versions 1 à 4) vers l'espace de l'appli. */
async function migrate(old){
  try{
    const [ns,os]=await Promise.all([base.get(),old.get()]);
    if(ns.exists||!os.exists)return;
    $('#app').innerHTML=splashHtml('Déplacement de tes données');
    const moves=[['categories',catsRef],['tasks',tasksRef],['plans',plansRef]];
    const snaps=await Promise.all(moves.map(m=>old.collection(m[0]).get()));
    for(let k=0;k<moves.length;k++)for(const d of snaps[k].docs)await moves[k][1].doc(d.id).set(Object.assign({},d.data()));
    await base.set(Object.assign({},os.data()));
    for(let k=0;k<moves.length;k++)for(const d of snaps[k].docs)await old.collection(moves[k][0]).doc(d.id).delete();
    await old.delete();
  }catch(e){toast('Le déplacement de tes données n’a pas abouti. Recharge la page pour réessayer.')}
}
async function loadPast(){
  if(!plansRef)return;

    snap.docs.forEach(d=>{const p=d.data();if(p&&p.date)S.past[p.date]=p});render();
  }catch(e){}
}

function buildTask(i,partial){
  const o={},dateOk=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
  if(i.title!=null)o.title=String(i.title).slice(0,140);
  if(i.categoryId!=null){const k=String(i.categoryId).toLowerCase();const c=S.cats.find(x=>x.id===String(i.categoryId)||String(x.name).toLowerCase()===k);if(!c)throw new Error('Catégorie inconnue : utilise un id de la liste.');o.catId=c.id}
  if(i.type!=null)o.type=i.type==='rec'?'rec':'once';
  if(i.date!==undefined)o.date=dateOk(i.date)?i.date:null;
  if(i.deadline!==undefined)o.deadline=dateOk(i.deadline)?i.deadline:null;
  if(i.time!==undefined)o.time=/^\d{1,2}:\d{2}$/.test(String(i.time||''))?String(i.time).padStart(5,'0'):null;
  if(i.duration_min!=null)o.duration=Math.min(600,Math.max(5,Math.round(+i.duration_min)||30));
  if(i.effort!=null)o.effort=Math.min(5,Math.max(1,Math.round(+i.effort)||2));
  if(i.priority!=null)o.priority=Math.min(10,Math.max(1,Math.round(+i.priority)||5));
  if(i.mandatory!=null)o.mandatory=!!i.mandatory;
  if(i.atWork!=null)o.atWork=!!i.atWork;
  if(i.freq!=null)o.freq=['day','week','month'].includes(i.freq)?i.freq:'day';
  if(i.every!=null)o.every=Math.max(1,Math.round(+i.every)||1);
  if(Array.isArray(i.days))o.days=i.days.map(Number).filter(n=>n>=0&&n<=6);
  if(i.monthDay!=null)o.monthDay=Math.min(31,Math.max(1,Math.round(+i.monthDay)||1));
  if(i.description!=null)o.desc=String(i.description).slice(0,2000);
  if(!partial){
    if(!o.title)throw new Error('Titre manquant.');if(!o.catId)throw new Error('Catégorie manquante.');
    const def={type:'once',duration:30,effort:2,priority:5,mandatory:false,atWork:false,catIds:[],desc:'',time:null,parentId:null,date:null,deadline:null,created:new Date().toISOString()};
    Object.keys(def).forEach(k=>{if(o[k]===undefined)o[k]=def[k]});
    if(o.type==='rec'){o.freq=o.freq||'day';o.every=o.every||1;o.days=o.days||[];o.monthDay=o.monthDay||1;o.start=today()}
  }
  return o;
}

function chatRules(canTools){

    'Règles : réponds en français, simplement et chaleureusement, en 1 à 5 phrases, sans markdown. Tu n’as pas accès à internet toi-même : n’invente jamais d’horaires, de prix ou d’adresses. Dates au format AAAA-MM-JJ.';
  if(canTools)s+=' Quand elle a besoin d’une info d’internet, utilise request_web_search (rattaché à la tâche concernée si elle existe) et dis-lui que la réponse de Claude s’affichera juste ici, à la suite de la conversation. Pour agir sur ses tâches, utilise les outils (list_tasks pour retrouver un id avant de modifier). Quand elle décrit une activité, choisis la catégorie la plus logique, estime une durée et un effort réalistes, crée la tâche puis dis en une phrase ce que tu as fait. Tu ne peux pas supprimer de tâche : invite-la à le faire depuis la tâche.';
  else{const pl=S.plan||{items:[]};s+=' Tu ne peux pas modifier ses tâches ici : explique-lui comment faire dans l’application. Son planning du jour : '+(pl.items.map(x=>{const t=taskById(x.tid);return t?(x.w?'au travail':toHM(x.s))+' '+t.title:null}).filter(Boolean).join(' ; ')||'vide')+'.'}
  return s;

async function sendChat(text){
  text=String(text||'').trim();if(!text||S.chatBusy)return;
  if(!S.sample){
    S.chat.push({role:'user',content:text});
    const m={id:'m'+Date.now().toString(36),role:'assistant',content:'Message transmis à Claude.',actions:[]};S.chat.push(m);saveChat();renderChatLog(true);
    const history=S.chat.slice(-12,-1).map(x=>(x.role==='user'?'Moi : ':'Life : ')+x.content).join('\n');
    try{await reqRef.doc().set({type:'chat',q:text,history,chatMsg:m.id,taskId:null,taskTitle:null,status:'pending',at:new Date().toISOString()})}
    catch(e){m.content='Message pas envoyé. Vérifie ta connexion et réessaie.';saveChat();renderChatLog(true)}
    return;
  }
  S.chat.push({role:'user',content:text});
  const msg={id:'m'+Date.now().toString(36),role:'assistant',content:'Life réfléchit…',actions:[]};S.chat.push(msg);
  S.chatBusy=true;renderChatLog(true);
  const ctl=new AbortController();S.chatCtl=ctl;
  let canTools=false;try{const lim=await S.sample.limits();canTools=!!(lim&&lim.tools)}catch(e){}
  const hist=S.chat.slice(0,-1).slice(-16).map(m=>({role:m.role,content:m.content||'…'}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const turns=[{role:'user',content:chatRules(canTools)}].concat(hist);
  const opts={signal:ctl.signal,modelTier:'quick',onText:({text})=>{msg.content=text;renderChatLog(true)}};
  if(canTools)opts.tools=chatTools(msg);else opts.cache=false;
  try{const r=await S.sample(turns,opts);msg.content=r.text}
  catch(e){
    const code=e&&e.code;const part=e&&e.text?e.text+'\n\n':'';
    msg.content=code==='cancelled'?(part||'')+'(arrêté)':part+(code==='not_granted'||code==='sampling_disabled'?'La discussion n’est pas autorisée sur ce compte.':code==='rate_limited'?'Trop de messages pour le moment. Réessaie un peu plus tard.':code==='refused'?'Je ne peux pas répondre à cette demande.':'Je n’ai pas pu répondre. Réessaie.');
  }finally{S.chatBusy=false;S.chatCtl=null;saveChat();renderChatLog(true)}

function chime(){
  if(!actx)return;try{const t0=actx.currentTime;
  [880,1175,1568].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),s=t0+i*0.18;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.18,s+0.02);g.gain.exponentialRampToValueAtTime(0.001,s+0.6);o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+0.7)})}catch(e){}
}

/* ---------- Notifications (Web Push, envoyées par la fonction Supabase life-push) ---------- */
const VAPID_PUBLIC='BKDQzWajzU-m9sGNnf1SZ-BCRpnYmD1X7Vq0xc2h2qlmYtiLsgaphi1MAlknUq7Hq0nG1KdfzXCmuZ0xcaS-4ZM';
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function pushStateText(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return standalone()?'Cet appareil ne gère pas les notifications.':'Sur iPhone, installe d’abord Life sur l’écran d’accueil (Safari, Partager, Sur l’écran d’accueil), puis ouvre-la depuis l’icône.';
  if(typeof Notification!=='undefined'&&Notification.permission==='denied')return 'Notifications refusées : autorise-les dans Réglages de l’iPhone, Notifications, Life.';
  return S.pushOn?'✅ Activées sur cet appareil.':'Pas encore activées sur cet appareil.';
}
function b64uToBytes(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
// À chaque ouverture : si les notifications sont déjà autorisées, on (ré)abonne l'appareil sans rien demander,
// pour qu'elles restent actives même après une réinstallation de l'icône.
async function saveSub(sub){
  const j=sub.toJSON();let h=0;for(const c of j.endpoint)h=(h*31+c.charCodeAt(0))>>>0;
  await db.collection('life/push').doc('d'+h.toString(36)).set({sub:j,device:navigator.userAgent.slice(0,120),at:new Date().toISOString()});
}
async function checkPush(){
  try{
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub&&typeof Notification!=='undefined'&&Notification.permission==='granted')sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUBLIC)});
    if(sub)await saveSub(sub);
    S.pushOn=!!sub;const el=$('#push-state');if(el)el.textContent=pushStateText();
  }catch(e){}
}
async function enablePush(btn){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast(pushStateText());return}
  btn.disabled=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notifications non autorisées.');return}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUBLIC)});
    await saveSub(sub);
    S.pushOn=true;toast('Notifications activées.');
  }catch(e){toast('Activation impossible : '+(e&&e.message||'erreur'))}
  finally{btn.disabled=false;const el=$('#push-state');if(el)el.textContent=pushStateText()}
}

const WX=c=>c===0?['☀️','Ensoleillé']:c<=2?['🌤️','Peu nuageux']:c===3?['☁️','Couvert']:c<=48?['🌫️','Brouillard']:c<=57?['🌦️','Bruine']:c<=67?['🌧️','Pluie']:c<=77?['❄️','Neige']:c<=82?['🌧️','Averses']:c<=86?['🌨️','Averses de neige']:['⛈️','Orage'];

  try{
    let lat=null,lon=null;
    try{const pos=await new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000,maximumAge:3600000}):rej());lat=pos.coords.latitude;lon=pos.coords.longitude}catch(e){}
    if(lat==null){

    }
    const w=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16')).json();

  }catch(e){}
}

/* ---------- Images des tâches ----------
   Image principale : t.coverId. Images dans la description : une ligne [image:ID] à l'endroit voulu.
   Les images sont réduites (1280 px max, JPEG) puis rangées dans Supabase, collection life/images. */
const IMG_RE=/\[image:([A-Za-z0-9]+)\]/g;
function descText(t){return String(t&&t.desc||'').replace(IMG_RE,'').replace(/\n{3,}/g,'\n\n').trim()}
function descImgIds(s){return [...String(s||'').matchAll(IMG_RE)].map(m=>m[1])}
function descHtml(s){
  const parts=String(s||'').split(/\[image:([A-Za-z0-9]+)\]/);let h='';
  parts.forEach((p,i)=>{if(i%2)h+='<img class="dimg" data-img="'+esc(p)+'" alt="Image de la description">';else{const txt=p.replace(/^\n+|\n+$/g,'');if(txt.trim())h+='<div class="ai-out">'+esc(txt)+'</div>'}});
  return h?'<div class="desc-view">'+h+'</div>':'';
}
function resizeImage(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej({code:'image'})};im.src=url})}
async function uploadImage(file){if(!db||!db.images)throw {code:'image'};return db.images.put(await resizeImage(file,1280))}
// Affiche les images dès qu'elles apparaissent à l'écran (chargées à la demande depuis Supabase).
function hydrateImgs(){if(!db||!db.images)return;document.querySelectorAll('img[data-img]:not([data-done])').forEach(el=>{el.dataset.done='1';
  db.images.get(el.dataset.img).then(src=>{if(src)el.src=src;else{const d=document.createElement('div');d.className='small muted';d.textContent='Image introuvable';el.replaceWith(d)}})})}
new MutationObserver(hydrateImgs).observe(document.documentElement,{childList:true,subtree:true});

const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function parseWhen(title){
  const s=' '+String(title||'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ')+' ';
  const td=today();let date=null,time=null,m;
  if((m=s.match(/(?:^|[^\d:/])([01]?\d|2[0-3])\s*(?:h|:)\s*([0-5]\d)?(?![\d/])/)))time=pad(+m[1])+':'+(m[2]||'00');
  const fix=(d,mo,y)=>{let yr=y?(+y<100?2000+ +y:+y):new Date().getFullYear();const dt=new Date(yr,mo-1,d);if(dt.getMonth()!==mo-1)return null;let r=ymd(dt);if(!y&&r<td)r=ymd(new Date(yr+1,mo-1,d));return r};
  if(/après[- ]demain/.test(s))date=addDays(td,2);
  else if(/\bdemain\b/.test(s))date=addDays(td,1);
  else if(/aujourd'hui|ce soir|ce midi|ce matin|cet après[- ]midi/.test(s))date=td;
  else if((m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/)))date=fix(+m[1],+m[2],m[3]);
  else if((m=s.match(/(?:^|\s)(1er|\d{1,2})\s+(janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)(?:\s+(\d{4}))?/)))date=fix(parseInt(m[1])||1,(MOIS.indexOf(m[2])+1)||({fevrier:2,aout:8,decembre:12}[m[2]]),m[3]);
  else{const i=DAYNAMES.findIndex(n=>s.includes(' '+n+' ')||s.includes(' '+n+','));if(i>=0){let n=(i-parseYmd(td).getDay()+7)%7;if(n===0)n=7;if(/\b(ce|cette)\s+\S+\s*$/.test(s.split(DAYNAMES[i])[0])&&n===7)n=0;date=addDays(td,n)}}
  if(time&&!date)date=toMin(time)>nowMin()?td:addDays(td,1);
  return {date,time};
}

function parseSwimImport(txt){
  const s=String(txt||'').replace(/```(?:json)?/gi,'');
  const i=s.search(/[\[{]/);if(i<0)return null;
  const j=s.lastIndexOf(s[i]==='{'?'}':']');if(j<=i)return null;

  try{data=JSON.parse(raw)}catch(e){try{data=JSON.parse(raw.replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'"))}catch(e2){return null}}
  const listOf=d=>Array.isArray(d)?d:d&&typeof d==='object'?(Array.isArray(d.sessions)?d.sessions:Array.isArray(d.seances)?d.seances:Array.isArray(d['séances'])?d['séances']:[d]):[];
  return listOf(data).filter(x=>x&&typeof x==='object').map(normSwim).filter(Boolean);
}
function normSwim(x){
  const m={};Object.keys(x).forEach(k=>{m[plain(k).replace(/[^a-z]/g,'')]=x[k]});
  const pick=(...ks)=>{for(const k of ks)if(m[k]!=null&&m[k]!=='')return m[k];return null};
  const txt=v=>{if(v==null)return '';if(Array.isArray(v))return v.map(y=>y&&typeof y==='object'?Object.values(y).filter(z=>z!=null&&z!=='').join(' · '):String(y)).join('\n');if(typeof v==='object')return Object.values(v).join(' · ');return String(v)};
  const num=(v,max)=>{const n=Math.round(parseFloat(String(v==null?'':v).replace(',','.')));return n>0?Math.min(max,n):null};
  let date=String(pick('date','jour')||'').trim();
  const fr=date.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(fr)date=fr[3]+'-'+pad(fr[2])+'-'+pad(fr[1]);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))date=null;
  let time=String(pick('time','heure','horaire')||'').trim().replace('h',':');if(/^\d{1,2}:$/.test(time))time+='00';
  time=/^\d{1,2}:\d{2}$/.test(time)?time.padStart(5,'0'):null;
  const ses={distance:num(pick('distancem','distance','distancetotale','metres'),20000),duration:num(pick('durationmin','duration','duree','dureemin','dureeestimee'),600),
    goal:txt(pick('goal','objectif','objective')).slice(0,300),warmup:txt(pick('warmup','echauffement')).slice(0,3000),
    main:txt(pick('main','mainset','corps','corpsdeseance','body')).slice(0,3000),cooldown:txt(pick('cooldown','retouraucalme','retourcalme')).slice(0,3000),
    notes:txt(pick('notes','consignes','adaptations','conseils')).slice(0,3000)};
  const title=txt(pick('title','titre','nom','name')).trim().slice(0,140)||'Séance de natation';
  if(!date&&!ses.main&&!ses.warmup&&!ses.distance)return null;
  return {title,date,time,ses};
}

async function replaceTask(id){
  const d=today(),plan=S.plan;if(!plan)return;
  const item=plan.items.find(i=>i.tid===id),old=taskById(id);if(!item||!old)return;
  const inPlan=new Set(plan.items.map(i=>i.tid)),room=item.e-item.s+30;
  const fp=futurePlans(addDays(d,14));const later=[];const when={};
  Object.keys(fp).sort().filter(x=>x>d).forEach(x=>fp[x].items.forEach(i=>{const t=taskById(i.tid);if(t&&t.type==='once'&&!later.includes(t)){later.push(t);when[t.id]=x}}));
  S.tasks.filter(t=>t.type==='once'&&!t.done&&!inPlan.has(t.id)&&!later.includes(t)&&dueOn(t,d)).forEach(t=>later.push(t));
  const ok=t=>{const w=winOf(t);return !inPlan.has(t.id)&&!t.time&&!isEvent(t)&&t.duration<=room&&!(plan.skipped||[]).includes(t.id)&&item.s>=w[0]&&item.s+t.duration<=w[1]};
  const alt=later.find(t=>ok(t)&&t.effort===old.effort)||later.find(t=>ok(t)&&Math.abs(t.effort-old.effort)===1);
  if(!alt){toast('Aucune tâche d’effort similaire n’est prévue plus tard.');return}
  const items=plan.items.filter(i=>i.tid!==id).concat({tid:alt.id,s:item.s,e:item.s+alt.duration,w:!!item.w}).sort((a,b)=>a.s-b.s);
  try{
    await plansRef.doc(d).update({items,skipped:(plan.skipped||[]).concat(id)});
    if(old.type==='once'&&(!old.date||old.date<=d))await tasksRef.doc(id).update({date:when[alt.id]||addDays(d,1)});
    if(alt.date&&alt.date>d)await tasksRef.doc(alt.id).update({date:d});
    toast('Remplacée par « '+alt.title+' ».');
  }catch(e){toast('Pas enregistré. Réessaie dans un instant.')}
}

  try{await base.update({loadBias:Math.round(b*100)/100});if(!noReplan){setTimeout(()=>replanToday(true),200);toast(delta>0?'Life ajoute un peu plus.':'Life allège ta journée.')}}catch(e){toast('Pas enregistré. Réessaie.')}

async function fillToday(cur,quiet){
  const d=today(),di=dayInfo(d);cur=cur||S.plan||{date:d,items:[],skipped:[]};
  const busy=[];if(di.works)busy.push([di.ws-di.c,di.we+di.c]);
  cur.items.forEach(i=>{if(!i.w)busy.push([i.s,i.e+10])});
  const inPlan=new Set(cur.items.map(i=>i.tid)),skipped=cur.skipped||[];
  const fp=futurePlans(addDays(d,30)),order=[];
  Object.keys(fp).sort().filter(x=>x>d).forEach(x=>fp[x].items.forEach(i=>{const t=taskById(i.tid);if(t&&t.type==='once'&&!order.includes(t))order.push(t)}));
  S.tasks.filter(t=>!order.includes(t)&&!isDone(t,d)&&(t.type==='once'||dueOn(t,d)))
    .sort((a,b)=>(prio(catOf(b))-prio(catOf(a)))||((+b.priority||5)-(+a.priority||5))).forEach(t=>order.push(t));
  const cands=order.filter(t=>!inPlan.has(t.id)&&!t.time&&!skipped.includes(t.id));
  const startDay=Math.max(di.wake+30,Math.ceil((nowMin()+5)/5)*5),endDay=di.sleep-30;
  const fi=()=>{const b=busy.slice().sort((x,y)=>x[0]-y[0]);const out=[];let c=startDay;
    for(const iv of b){if(iv[0]>c)out.push([c,Math.min(iv[0],endDay)]);c=Math.max(c,iv[1])}
    if(c<endDay)out.push([c,endDay]);return out.filter(iv=>iv[1]-iv[0]>=10)};
  const free=fi().reduce((a,iv)=>a+iv[1]-iv[0],0);
  const planned=cur.items.filter(i=>!i.w&&i.s>=startDay).reduce((a,i)=>{const t=taskById(i.tid);return a+(t&&!isDone(t,d)?i.e-i.s+10:0)},0);
  const cap=Math.max(0,0.75*(free+planned)-planned);let used=0;
  const items=cur.items.slice(),added=[];
  for(const t of cands){
    if(used+t.duration>cap)continue;
    const slot=fitSlot(fi(),t);if(!slot)continue;
    items.push({tid:t.id,s:slot[0],e:slot[0]+t.duration});busy.push([slot[0],slot[0]+t.duration+10]);used+=t.duration+10;added.push(t);
    if(added.length>=8)break;
  }
  if(!added.length)return 0;
  items.sort((a,b)=>a.s-b.s);
  await plansRef.doc(d).set({date:d,items,skipped,at:new Date().toISOString()});
  for(const t of added)if(t.type==='once'&&t.date!==d)await tasksRef.doc(t.id).update({date:d});
  return added.length;
}

  const c=catOf(t),p=S.profile||{};
  const prompt='Tu es Life, une coach de vie bienveillante. Tâche : "'+t.title+'" (catégorie '+c.name+' ; '+recLabel(t)+(t.time?' à '+t.time:'')+' ; durée prévue '+fmtDur(t.duration)+'). Description : '+(descText(t)||'aucune')+'. Ville : '+(p.city||'non précisée')+'. Date du jour : '+today()+'.\n'+
    'Aide concrètement, en français, en 120 à 220 mots, avec trois parties titrées sur une ligne seule : "Étapes", "À prévoir" (ce qu’il faut acheter, réserver ou apporter, et quand s’en occuper), "Pour s’y mettre" (une astuce). Listes avec des lignes commençant par "- ". Pas de markdown (pas de **, pas de #). Tu n’as pas accès à internet : n’invente aucun horaire ni prix, indique où les vérifier (site officiel, billetterie, application).';
  try{
    const r=await S.sample(prompt,{signal:ctl.signal,onText:({text})=>{out.textContent=text}});
    out.textContent=r.text;await tasksRef.doc(id).update({assist:r.text,assistAt:new Date().toISOString()});
  }catch(e){
    if(e&&e.code==='cancelled')return;
    out.textContent=(e&&e.text)||'';
    out.textContent+=(out.textContent?'\n\n':'')+(e&&(e.code==='not_granted'||e.code==='sampling_disabled')?'L’aide de Life n’est pas autorisée sur ce compte.':e&&e.code==='rate_limited'?'Trop de demandes pour le moment. Réessaie un peu plus tard.':'L’aide n’a pas pu répondre. Réessaie.');
  }finally{btn.disabled=false}
}
async function split(id,btn){
  const t=taskById(id);if(!t||!S.sample)return;
  const box=$('#ai-steps');box.innerHTML='<p class="small muted">Life découpe ta tâche…</p>';btn.disabled=true;
  const td=today();
  const prompt='Tu aides une personne à s’organiser. Découpe la tâche "'+t.title+'" en 3 à 7 étapes progressives, réparties entre le '+td+' et la date limite du '+t.deadline+' (la dernière étape au plus tard la veille si possible). Description : '+(descText(t)||'aucune')+'.\n'+
    'Réponds uniquement avec un tableau JSON d’objets {"title": string court en français, "date": "AAAA-MM-JJ", "minutes": durée entière, "effort": entier de 1 à 5}. Exemple : [{"title":"Rassembler les documents","date":"'+addDays(td,1)+'","minutes":30,"effort":2}]';
  try{
    const arr=await S.sample.json(prompt,{modelTier:'default'});
    const steps=(Array.isArray(arr)?arr:[]).filter(s=>s&&s.title).map(s=>({title:String(s.title).slice(0,140),
      date:(/^\d{4}-\d{2}-\d{2}$/.test(s.date)&&s.date>=td&&s.date<=t.deadline)?s.date:td,
      minutes:Math.min(240,Math.max(5,Math.round(+s.minutes)||30)),effort:Math.min(5,Math.max(1,Math.round(+s.effort)||2))}));
    if(!steps.length){box.innerHTML='<p class="small muted">Pas d’étapes proposées. Réessaie.</p>';return}
    split.steps=steps;split.parent=t;
    box.innerHTML='<div class="stack" style="gap:6px">'+steps.map((s,i)=>'<label class="toggle"><input type="checkbox" class="st" value="'+i+'" checked> <span><b>'+esc(fmtShort(s.date))+'</b> · '+esc(s.title)+' <span class="muted small">('+fmtDur(s.minutes)+')</span></span></label>').join('')+
      '</div><button class="btn" data-act="addsteps" style="margin-top:8px">Ajouter comme sous-tâches</button>';
  }catch(e){box.innerHTML='<p class="small muted">'+(e&&e.code==='rate_limited'?'Trop de demandes pour le moment. Réessaie plus tard.':'Le découpage n’a pas abouti. Réessaie.')+'</p>'}
  finally{btn.disabled=false}
}
async function addSteps(btn){
  const p=split.parent,steps=split.steps||[];if(!p)return;btn.disabled=true;
  const idx=$$('.st:checked').map(i=>+i.value);
  try{
    for(const i of idx){const s=steps[i];await tasksRef.doc().set({title:s.title,catId:p.catId,catIds:[],type:'once',date:s.date,deadline:null,duration:s.minutes,effort:s.effort,priority:p.priority||5,mandatory:!!p.mandatory,atWork:false,desc:'',parentId:p.id,time:null,created:new Date().toISOString()})}
    closeSheet();toast(idx.length+' sous-tâche'+(idx.length>1?'s ajoutées':' ajoutée')+'.');
    setTimeout(()=>replanToday(true),400);
  }catch(e){btn.disabled=false;toast('Pas enregistré. Réessaie.')}
}

/* ---------- Événements ---------- */
document.addEventListener('click',async e=>{
  const navb=e.target.closest('#nav button');
  if(navb){S.view=navb.dataset.view;S.menu=null;if(S.view==='tasks')S.catPage='list';$('#app').innerHTML='';render();if(S.view==='cal')loadPast();window.scrollTo(0,0);return}
  if(e.target.id==='sheet'){closeSheet();return}
  if(S.menu&&!e.target.closest('.menu')&&!e.target.closest('[data-act="menu"]')){S.menu=null;render();if(!e.target.closest('[data-act="toggle"]'))return}
  const pb=e.target.closest('.days button,.seg button,.multi button,.swatches button,.presets button');
  if(pb&&!pb.dataset.act){
    const g=pb.parentElement;
    if(g.classList.contains('presets')){$('#f-dur').value=pb.dataset.min;return}
    if(g.classList.contains('days')||g.classList.contains('multi'))pb.setAttribute('aria-pressed',pb.getAttribute('aria-pressed')!=='true');
    else g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===pb));
    if(g.id==='f-type'){const v=pb.dataset.v;$('#f-recwrap').hidden=v!=='rec';$('#f-oncewrap').hidden=v!=='once'}
    if(g.id==='f-freq'){const v=pb.dataset.v;$('#f-everywrap').hidden=v!=='day';$('#f-dayswrap').hidden=v!=='week';$('#f-mdaywrap').hidden=v!=='month'}
    return;
  }
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==='close')closeSheet();
  else if(act==='onboard')onboard();
  else if(act==='toggle'){
    e.stopPropagation();await toggleTask(id);
    if(a.dataset.close)closeSheet();
    else if(a.dataset.refresh)setTimeout(()=>{const p=taskById(a.dataset.refresh);if(p&&!$('#sheet').hidden)openSheet(taskDetail(p))},250);
  }
  else if(act==='menu'){e.stopPropagation();S.menu=S.menu===id?null:id;render()}
  else if(act==='replace'){S.menu=null;replaceTask(id);render()}
  else if(act==='open'){const t=taskById(id);if(t)openSheet(taskDetail(t))}
  else if(act==='cover-del'){$('#f-cover').value='';$('#f-coverbox').innerHTML='';$('#f-coverlbl').firstChild.textContent='🖼️ Ajouter une image principale';a.hidden=true}
  else if(act==='edit'){S.menu=null;const t=taskById(id);if(t)openSheet(taskForm(t));render()}
  else if(act==='new')openSheet(taskForm(null,a.dataset.cat?{catId:a.dataset.cat}:null));
  else if(act==='del'){
    if(!a.dataset.confirm){a.dataset.confirm='1';a.textContent='Confirmer la suppression';return}
    try{await tasksRef.doc(id).delete();closeSheet();toast('Tâche supprimée.')}catch(err){toast('Pas supprimée. Réessaie.')}
  }
  else if(act==='replan'){a.disabled=true;await replanToday(false,true);a.disabled=false}
  else if(act==='lighter')setBias(-0.1);
  else if(act==='more'){S.fbHidden=true;await setBias(0.1,true);replanToday(false,true)}
  else if(act==='fbok'){S.fbHidden=true;render()}
  else if(act==='resetload'){try{await base.update({loadBias:1});toast('Charge normale rétablie.')}catch(err){toast('Pas enregistré. Réessaie.')}}
  else if(act==='keepv2'){try{await base.update({v:2})}catch(err){toast('Pas enregistré. Réessaie.')}}
  else if(act==='reset'){
    if(!a.dataset.confirm){a.dataset.confirm='1';a.textContent='Oui, tout effacer';return}
    resetAll(a);
  }
  else if(act==='gocal'){S.view='cal';$('#app').innerHTML='';render();loadPast();window.scrollTo(0,0)}
  else if(act==='day')openSheet(daySheet(a.dataset.date));
  else if(act==='calmode'){S.cal.mode=a.dataset.v;render();loadPast()}
  else if(act==='calnav'){const n=+a.dataset.n;
    if(n===0)S.cal.anchor=today();
    else if(S.cal.mode==='week')S.cal.anchor=addDays(S.cal.anchor,7*n);
    else{const d=parseYmd(S.cal.anchor);S.cal.anchor=ymd(new Date(d.getFullYear(),d.getMonth()+n,1))}
    render();loadPast()}
  else if(act==='opencat'){S.catPage='cat';S.catOpen=id;render();window.scrollTo(0,0)}
  else if(act==='backcats'){S.catPage='list';render()}
  else if(act==='history'){S.catPage='history';render();window.scrollTo(0,0)}
  else if(act==='newcat')openSheet(catForm());
  else if(act==='editcat'){const c=S.cats.find(x=>x.id===id);if(c)openSheet(catForm(c))}
  else if(act==='delcat'){
    const n=S.tasks.filter(t=>t.catId===id).length;
    if(n){$('#c-msg').textContent='Cette catégorie contient '+n+' tâche'+(n>1?'s':'')+'. Change-les de catégorie ou supprime-les d’abord.';return}
    if(!a.dataset.confirm){a.dataset.confirm='1';a.textContent='Confirmer la suppression';return}
    try{await catsRef.doc(id).delete();closeSheet();S.catPage='list';render();toast('Catégorie supprimée.')}catch(err){toast('Pas supprimée. Réessaie.')}
  }
  else if(act==='odone'||act==='otoday'||act==='oabandon'||act==='olater'){
    const t=taskById(id);if(!t)return;a.disabled=true;
    const patch=act==='odone'?{done:true,doneAt:new Date().toISOString(),doneDay:t.date}:act==='otoday'?{date:today()}:act==='olater'?{date:null,postponed:(t.postponed||0)+1,postponedAt:new Date().toISOString()}:{abandoned:true,abandonedAt:new Date().toISOString()};
    try{await tasksRef.doc(id).update(patch);toast(act==='odone'?'Bien noté.':act==='otoday'?'Ajoutée à aujourd’hui.':act==='olater'?'Pas de souci : Life lui trouve un meilleur moment. Tu vas y arriver !':'Retirée de ta liste et de ta journée.');setTimeout(()=>replanToday(true),400)}
    catch(err){a.disabled=false;toast('Pas enregistré. Réessaie.')}
  }
  else if(act==='lmove'||act==='lskip'){
    const t=taskById(id);if(!t)return;a.disabled=true;
    try{
      if(act==='lmove')await tasksRef.doc(id).update({time:null,timeWas:t.time});
      else if(t.type==='once')await tasksRef.doc(id).update({time:null,timeWas:t.time,date:null,postponed:(t.postponed||0)+1,postponedAt:new Date().toISOString()});
      else if(S.plan)S.plan=Object.assign({},S.plan,{skipped:(S.plan.skipped||[]).concat(id)});
      if(a.dataset.close)closeSheet();S.menu=null;
      setTimeout(()=>replanToday(true),400);toast(act==='lmove'?'Life la replace plus tard dans ta journée.':t.type==='once'?'Pas de souci : Life lui trouve un meilleur moment. Tu vas y arriver !':'OK pour aujourd’hui. Demain, c’est reparti !');
    }catch(err){a.disabled=false;toast('Pas enregistré. Réessaie.')}
  }
  else if(act==='dtomorrow'){
    const t=taskById(id);if(!t)return;a.disabled=true;
    try{await tasksRef.doc(id).update({date:addDays(today(),1),time:null,timeWas:t.time||null,postponed:(t.postponed||0)+1,postponedAt:new Date().toISOString()});
      if(a.dataset.close)closeSheet();S.menu=null;setTimeout(()=>replanToday(true),400);toast('C’est pour demain. Tu vas y arriver !')}
    catch(err){a.disabled=false;toast('Pas enregistré. Réessaie.')}
  }
  else if(act==='pushon')enablePush(a);
  else if(act==='pushtest')testPush();
  else if(act==='authswitch'){S.auth=S.auth==='signup'?'signin':'signup';$('#app').innerHTML='';render()}
  else if(act==='logout'){await sb.auth.signOut();location.reload()}
  else if(act==='websearch'){a.disabled=true;try{await requestWeb($('#web-q').value,id);toast('Question transmise à Claude.')}catch(err){toast('Pas envoyée. Réessaie.')}a.disabled=false}
  else if(act==='alertok')$('#alert').hidden=true;
  else if(act==='testalert')showAlert({title:'Exemple d’alerte',time:toHM(nowMin()+10),catId:''},10);
  else if(act==='sugg')sendChat(a.dataset.q);
  else if(act==='chatstop'){if(S.chatCtl)S.chatCtl.abort()}
  else if(act==='chatclear'){if(S.chatBusy)return;S.chat=[];saveChat();render()}
  else if(act==='assist')assist(id,a);
  else if(act==='split')split(id,a);
  else if(act==='addsteps')addSteps(a);
  else if(act==='exzoom'){e.stopPropagation();exZoom(id,a.dataset.n)}
  else if(act==='exclose'){const o=$('#exzoom');if(o)o.hidden=true}
  else if(act==='wskip')workoutSkip(id,a.dataset.mode,a);
  else if(act==='wunskip')workoutUnskip(id,a);
  else if(act==='swimadd')openSheet(swimImportSheet());
  else if(act==='swimprompt')copyOrShow(swimPrompt(),'✅ Consigne copiée. Colle-la dans ta conversation ChatGPT habituelle.','#sw-imp-msg');
  else if(act==='swimimport')importSwim(a);
  else if(act==='swimcopy'){const t=taskById(id);if(t)copyOrShow(swimReport(t),'✅ Copié ! Ouvre ta conversation ChatGPT habituelle et colle le texte pour qu’il adapte tes prochaines séances.','#sw-msg')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#exzoom')&&!$('#exzoom').hidden){$('#exzoom').hidden=true;return}
  if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(S.menu){S.menu=null;render()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('cell')){e.preventDefault();openSheet(daySheet(e.target.dataset.date))}
});
document.addEventListener('input',e=>{
  if(e.target.id==='f-title'){const s=$('#f-moment');if(s&&s.options[0])s.options[0].textContent=autoLabel(e.target.value);fillWhenFromTitle()}
  if(e.target.id==='f-date'||e.target.id==='f-time')e.target.dataset.auto='';
  if(e.target.id==='f-effort')$('#f-efflabel').textContent=EFFORT[+e.target.value];
  if(e.target.id==='f-prio')$('#f-priolabel').textContent=e.target.value+'/10';
  if(e.target.id==='c-prio')$('#c-priolabel').textContent=e.target.value+'/10';
});
async function addTaskImage(inp){
  const file=inp.files[0],msg=$('#f-imgmsg'),cover=inp.id==='f-coverfile',ta=$('#f-desc');
  const pos=ta?ta.selectionStart:0;inp.value='';
  if(!/^image\//.test(file.type)){toast('Ce fichier n’est pas une image.');return}
  if(msg)msg.textContent='Ajout de l’image…';
  try{
    const id=await uploadImage(file);if(msg)msg.textContent='';
    if(cover){$('#f-cover').value=id;$('#f-coverbox').innerHTML='<img class="cover" data-img="'+esc(id)+'" alt="Image principale">';
      $('#f-coverlbl').firstChild.textContent='Changer l’image';const del=document.querySelector('[data-act="cover-del"]');if(del)del.hidden=false}
    else{const v=ta.value,before=v.slice(0,pos),after=v.slice(pos);
      const tag=(before&&!before.endsWith('\n')?'\n':'')+'[image:'+id+']'+(after.startsWith('\n')?'':'\n');
      ta.value=before+tag+after;const c=before.length+tag.length;ta.focus();ta.setSelectionRange(c,c);$('#f-descprev').innerHTML=descPreview(ta.value)}
  }catch(err){if(msg)msg.textContent='';toast('L’image n’a pas pu être ajoutée. Réessaie.')}
}
document.addEventListener('change',e=>{
  if(e.target.id==='imp-file'&&e.target.files[0])importData(e.target.files[0]);
  if(e.target.id==='f-cat'){const f=$('#task-form');$('#f-others').innerHTML=othersHtml(e.target.value,f.dataset.id)}
  if(e.target.id==='f-desc'){const pv=$('#f-descprev');if(pv)pv.innerHTML=descPreview(e.target.value)}
  if((e.target.id==='f-coverfile'||e.target.id==='f-descfile')&&e.target.files[0])addTaskImage(e.target);
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;const btn=f.querySelector('[type=submit]');
  if(f.id==='auth-form'){
    const email=$('#a-email').value.trim(),pass=$('#a-pass').value,msg=$('#a-msg');btn.disabled=true;msg.textContent='…';
    try{
      if(f.dataset.mode==='signup'){
        const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(data.session){await startStore(data.session.user.id);return}
        msg.textContent='Compte créé. Ouvre le mail de confirmation et clique sur le lien, puis reviens te connecter ici.';
      }else{
        const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error)throw error;
        await startStore(data.session.user.id);return;
      }
    }catch(err){const m=String(err&&err.message||'');msg.textContent=/confirm/i.test(m)?'Confirme d’abord ton mail avec le lien reçu.':/invalid/i.test(m)?'Mail ou mot de passe incorrect.':/signups? not allowed|disabled/i.test(m)?'La création de compte est fermée.':'Ça n’a pas marché : '+m}
    btn.disabled=false;return;
  }
  if(f.id==='home-ask'){const v=$('#homeask').value.trim();if(!v)return;$('#homeask').value='';S.view='chat';$('#app').innerHTML='';render();window.scrollTo(0,0);sendChat(v);return}
  if(f.id==='sw-form'){saveSwimFb(f,btn);return}
  if(f.id==='chat-form'){const inp=$('#chat-in');const v=inp.value.trim();if(!v)return;inp.value='';sendChat(v);return}
  if(f.id==='task-form'){
    const o=readTaskForm();if(!o.title)return;
    // Incohérence entre l'heure et le moment de la journée (ex. « Soirée » à 12:20) : on prévient une fois.
    if(o.time&&!f.dataset.warned){const w=winOf(o),m=toMin(o.time);
      if(m<w[0]||m>=w[1]){f.dataset.warned='1';const wn=$('#f-warn');wn.hidden=false;
        wn.textContent='« '+o.title+' » à '+o.time+' ? Ça ressemble plutôt à : '+MOMENTS[momentOf(o)].l.toLowerCase()+'. Corrige l’heure ou le moment, ou clique encore sur Enregistrer pour garder '+o.time+'.';
        $('#f-time').focus();return}}
    // Heure gardée malgré l'avertissement : Life ne la retirera pas. Une nouvelle heure remplace l'ancienne retirée.
    o.timeOk=!!(o.time&&f.dataset.warned);if(o.time)o.timeWas=null;
    if(!o.catId){toast('Crée d’abord une catégorie.');return}
    if(o.type==='rec'&&o.freq==='week'&&!o.days.length){toast('Choisis au moins un jour.');return}
    btn.disabled=true;btn.textContent='Enregistrement…';
    try{
      const id=f.dataset.id,old=id?taskById(id):null;
      if(o.type==='rec'&&!(old&&old.start))o.start=today();
      let tid=id;
      if(id)await tasksRef.doc(id).update(Object.assign({example:false},o));
      else{const ref=tasksRef.doc();tid=ref.id;await ref.set(Object.assign({created:new Date().toISOString()},o))}
      const subs=$('#f-subs').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,20);
      for(const s of subs)await tasksRef.doc().set({title:s.slice(0,140),catId:o.catId,catIds:[],type:'once',date:null,deadline:o.deadline||null,duration:20,effort:2,priority:o.priority,mandatory:o.mandatory,atWork:false,desc:'',parentId:tid,time:null,created:new Date().toISOString()});
      // Images retirées de la tâche : supprimées de Supabase pour ne pas encombrer.
      if(old){const keep=new Set([o.coverId].concat(descImgIds(o.desc)));[old.coverId].concat(descImgIds(old.desc)).filter(x=>x&&!keep.has(x)).forEach(x=>db.images.del(x).catch(()=>{}))}
      closeSheet();toast(id?'Tâche modifiée.':'Tâche créée.');
      setTimeout(()=>replanToday(true),400);
    }catch(err){btn.disabled=false;btn.textContent='Réessayer';toast('Pas enregistré. Réessaie.')}
  }else if(f.id==='cat-form'){
    const col=document.querySelector('#c-color [aria-pressed="true"]');
    const o={name:$('#c-name').value.trim(),emoji:$('#c-emoji').value.trim()||'✨',desc:$('#c-desc').value.trim(),color:col?col.dataset.v:COLORS[0],priority:+$('#c-prio').value};
    if($('#c-parent'))o.parentId=$('#c-parent').value||null;
    if(!o.name)return;btn.disabled=true;
    try{const id=f.dataset.id;if(id)await catsRef.doc(id).update(o);else await catsRef.doc().set(o);closeSheet();toast('Catégorie enregistrée.');setTimeout(()=>replanToday(true),300)}
    catch(err){btn.disabled=false;toast('Pas enregistré. Réessaie.')}
  }else if(f.id==='settings-form'){
    const r=document.querySelector('input[name="s-rule"]:checked');
    const o={wake:$('#s-wake').value||'07:00',sleep:$('#s-sleep').value||'23:00',work:$('#s-work').checked,workStart:$('#s-ws').value||'09:00',workEnd:$('#s-we').value||'17:30',
      workDays:$$('#s-days [aria-pressed="true"]').map(b=>+b.dataset.day),commute:+$('#s-commute').value||0,city:$('#s-city').value.trim(),
      prioRule:r?r.value:'guaranteed',hideDone:$('#s-hidedone').checked,alerts:$('#s-alerts').checked,sound:$('#s-sound').checked};
    btn.disabled=true;
    try{await base.update(o);toast('Réglages enregistrés.');setTimeout(()=>replanToday(true),300)}catch(err){toast('Pas enregistré. Réessaie.')}
    btn.disabled=false;
  }
});

boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life</title>
<meta name="theme-color" content="#FFFEFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : une colonne centrée (max 760px), verre dépoli clair sur taches pastel (palette de Tania), barre d'onglets en bas avec Home mis en avant. Mode clair uniquement. */
:root{
  --paper:#FFFEFB; --white:#FFFFFF; --cream:#FFECCD; --pink:#FCD9F7; --grey:#E3E2E2; --cyan:#CAFAFF;
  --ink:#2B2633; --muted:#6B6573; --line:rgba(43,38,51,.12); --soft:rgba(43,38,51,.06);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.94); --glass-edge:rgba(255,255,255,.9);
  --accent:#2B2633; --accent-ink:#FFFEFB; --ok:#2E7D57; --warn:#A4521B;
  --r-card:10px; --r-btn:8px; --r-chip:6px;
  --shadow:0 6px 24px rgba(43,38,51,.08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px)}
.bg i:nth-child(1){width:48vmax;height:48vmax;background:var(--cream);top:-16vmax;left:-14vmax}
.bg i:nth-child(2){width:40vmax;height:40vmax;background:var(--pink);top:8vmax;right:-16vmax}
.bg i:nth-child(3){width:40vmax;height:40vmax;background:var(--cyan);bottom:-16vmax;left:4vmax}
.bg i:nth-child(4){width:24vmax;height:24vmax;background:var(--grey);bottom:18vmax;right:8vmax;opacity:.7}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.05}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--glass-edge);border-radius:var(--r-card);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:0;border-radius:var(--r-btn);padding:9px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.soft{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.85rem}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:var(--r-btn);display:grid;place-items:center;color:var(--muted);font-size:1.1rem;flex:none}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-chip);background:var(--c,var(--grey));color:var(--ink);font-size:.78rem;font-weight:600;white-space:nowrap}
.etile{flex:none;width:34px;height:34px;border-radius:var(--r-btn);display:grid;place-items:center;background:var(--c,var(--grey));font-size:1.05rem}
.tag-ex{font-size:.7rem;padding:1px 6px;border-radius:var(--r-chip);border:1px dashed var(--muted);color:var(--muted)}

/* En-tête Home */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.7rem;letter-spacing:-.02em}
.logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,var(--cream),var(--pink),var(--cyan),var(--cream));border:1px solid var(--line)}
.progress{height:10px;border-radius:5px;background:var(--grey);overflow:hidden}
.progress b{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#f7c58a,#f3a6e6,#7fe3ee);transition:width .5s ease}
.stats{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Timeline */
.timeline{display:flex;flex-direction:column;gap:8px}
.tl{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start}
.tl .time{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);padding-top:15px;text-align:right}
.tl.marker .time{padding-top:3px}
.marker-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.82rem;padding:2px 0}
.marker-line::after{content:"";flex:1;height:1px;background:var(--line)}
.tcard{position:relative;display:flex;align-items:center;gap:10px;padding:9px 8px 9px 10px;cursor:pointer;min-width:0}
.tcard .body{flex:1;min-width:0}
.tcard .t{font-weight:600;overflow-wrap:anywhere}
.tcard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:2px}
.tcard.done .t{text-decoration:line-through;color:var(--muted)}
.tcard.done{opacity:.72}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(43,38,51,.35);background:var(--white);display:grid;place-items:center;color:var(--ink);font-size:.85rem;font-weight:700}
.check.on{background:var(--c,var(--cream));border-color:var(--ink)}
.menu{position:absolute;right:8px;top:calc(100% - 4px);z-index:5;background:var(--white);border:1px solid var(--line);border-radius:var(--r-btn);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:220px;overflow:hidden}
.menu button{border:0;background:none;text-align:left;padding:10px 14px;font-size:.9rem}
.menu button:hover{background:var(--soft)}
.work{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.work .line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.82rem}
.work .line::before,.work .line::after{content:"";height:1px;flex:1;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.next{grid-template-columns:1fr}}
.next .glass{padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.emos{font-size:.95rem;letter-spacing:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* Listes */
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-width:0}
.list-item .body{flex:1;min-width:0}
.list-item .t{font-weight:600;overflow-wrap:anywhere}
.sub{margin-left:26px}
.big{font-family:var(--f-display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}

/* Calendrier */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week .day{display:flex;flex-direction:column;gap:5px;padding:8px;min-width:0;min-height:120px}
.week .day.today{outline:2px solid var(--ink);outline-offset:-2px}
.week .it{font-size:.74rem;padding:4px 5px;border-radius:var(--r-chip);background:var(--c,var(--grey));cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week .it.done{opacity:.55;text-decoration:line-through}
@media (max-width:720px){.week{grid-template-columns:1fr}.week .day{min-height:0}.week .it{font-size:.85rem;white-space:normal}}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .h{font-size:.72rem;color:var(--muted);text-align:center;font-weight:600}
.month .cell{aspect-ratio:1/1;max-width:100%;border-radius:var(--r-btn);background:var(--glass);border:1px solid var(--glass-edge);padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;font-variant-numeric:tabular-nums;font-size:.8rem}
.month .cell.out{opacity:.4}
.month .cell.today{outline:2px solid var(--ink);outline-offset:-2px}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c);border:1px solid rgba(43,38,51,.25)}

/* Formulaires */
label.f,.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--white);border-radius:var(--r-btn);padding:9px 11px;font-weight:400;color:var(--ink)}
input[type=file]{font-size:.85rem;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.days,.seg,.multi,.presets{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--white);font-weight:600;font-size:.85rem}
.seg button,.multi button,.presets button{border:1px solid var(--line);background:var(--white);border-radius:var(--r-btn);padding:6px 11px;font-size:.85rem}
.days button[aria-pressed="true"],.seg button[aria-pressed="true"],.multi button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:transparent}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:var(--r-btn);border:2px solid var(--line);background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:500;color:var(--ink)}
.toggle input{width:19px;height:19px;accent-color:var(--ink);flex:none}
.compare{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);font-weight:400}
.compare div{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center}
.compare b{font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
.bar{height:6px;border-radius:3px;background:var(--c,var(--grey));border:1px solid rgba(43,38,51,.15)}
.ai-out{white-space:pre-wrap;background:var(--white);border:1px solid var(--line);border-radius:var(--r-btn);padding:12px 14px;font-size:.92rem;overflow-wrap:anywhere}
.thumb{max-width:100%;max-height:220px;border-radius:var(--r-btn);object-fit:cover}
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--white);font-weight:400;color:var(--ink);cursor:pointer}
.rule input{margin-top:3px;accent-color:var(--ink)}

/* Barre du bas */
/* Discussion, alertes */
.askbar,.chatbar{display:flex;gap:8px;padding:6px;align-items:center}
.askbar input,.chatbar input{flex:1;min-width:0;border:0;background:transparent;padding:8px 10px}
.askbar input:focus-visible,.chatbar input:focus-visible{outline:none}
.askbar:focus-within,.chatbar:focus-within{outline:2px solid var(--ink);outline-offset:1px}
.chatbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--glass-strong)}
.chat-log{display:flex;flex-direction:column;gap:10px;min-height:30vh}
.msg{display:flex;flex-direction:column;gap:4px;max-width:88%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg .bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 13px;border-radius:var(--r-card);background:var(--white);border:1px solid var(--line)}
.msg.user .bubble{background:var(--ink);color:var(--paper);border-color:transparent}
.msg .acts{font-size:.8rem;color:var(--ok);display:flex;flex-direction:column;gap:2px}
.alert{position:fixed;z-index:60;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 24px));padding:12px 14px;display:flex;gap:10px;align-items:center;background:var(--glass-strong)}
#nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(500px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px;border-radius:14px}
#nav button{border:0;background:transparent;border-radius:var(--r-btn);padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-size:.7rem;font-weight:600;color:var(--muted);gap:2px}
#nav button svg{width:22px;height:22px}
#nav button[aria-current="page"]{color:var(--ink);background:var(--soft)}
#nav .home{background:transparent!important}
#nav .home .orb{width:54px;height:54px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--cream),var(--pink),var(--cyan),var(--cream));border:3px solid var(--white);box-shadow:var(--shadow);font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--ink)}
#nav .home[aria-current="page"] .orb{border-color:var(--ink)}

/* Feuille */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,38,51,.28)}
#sheet .panel{width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;border:1px solid var(--glass-edge)}
@media (min-width:700px){#sheet{align-items:center}#sheet .panel{border-radius:14px}}
#toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r-btn);font-size:.9rem;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:26px 18px;display:flex;flex-direction:column;gap:10px;align-items:center}
details summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wx{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink)}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main id="app" aria-live="polite"></main>
<nav id="nav" class="glass" aria-label="Navigation" hidden>
  <button data-view="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M14 17h6M17 14v6"/></svg>Tâches</button>
  <button data-view="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendrier</button>
  <button data-view="home" class="home" aria-label="Home"><span class="orb">Life</span>Home</button>
  <button data-view="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/><path d="M8.5 9h7M8.5 12h4.5"/></svg>Discuter</button>
  <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
</nav>
<div id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" id="panel"></div></div>
<div id="toast" role="status" hidden></div>
<div id="alert" class="alert glass" role="alert" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const toMin=t=>{if(!t)return null;const p=String(t).split(':').map(Number);return p[0]*60+(p[1]||0)};
const toHM=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.round(m%60));
const today=()=>ymd(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const fmtDay=s=>parseYmd(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>parseYmd(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const fmtWd=s=>parseYmd(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'});
const fmtDur=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+pad(m%60):'');
const mondayOf=s=>addDays(s,-((parseYmd(s).getDay()+6)%7));
const EFFORT=[null,'Très léger','Léger','Moyen','Exigeant','Très exigeant'];
const OLD_MIN=[null,10,20,45,90,150];
const PRESETS=[10,15,30,45,60,90,120];
const COLORS=['#FFECCD','#FCD9F7','#CAFAFF','#E3E2E2','#FFD9C7','#D9F7D2','#E6DDFC','#FFF4B0'];
const DAYS=[[1,'L'],[2,'M'],[3,'M'],[4,'J'],[5,'V'],[6,'S'],[0,'D']];
const DAYNAMES=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const FOCUS=[
  {k:'orga',name:'Organisation perso',emoji:'🗂️',color:'#FFECCD',priority:8,desc:'Démarches, rendez-vous, anniversaires, listes'},
  {k:'travail',name:'Travail & projets perso',emoji:'💼',color:'#E6DDFC',priority:7,desc:'Ce que je fais avancer'},
  {k:'maison',name:'Maison & ménage',emoji:'🏠',color:'#CAFAFF',priority:6,desc:'Rangement, linge, entretien, réparations'},
  {k:'bien',name:'Bien-être',emoji:'🌿',color:'#D9F7D2',priority:6,desc:'Sport, soins, routines'},
  {k:'loisirs',name:'Loisirs & sorties',emoji:'🎨',color:'#FCD9F7',priority:5,desc:'Lecture, films, expos, sorties'}
];
const EXAMPLES=[
  {cat:'orga',title:'Déclarer mes impôts',type:'once',deadlineIn:10,duration:60,effort:4,priority:9,mandatory:true},
  {cat:'orga',title:'Payer le loyer',type:'rec',freq:'month',monthDay:5,duration:10,effort:1,priority:9,mandatory:true},

function norm(t){
  const o=Object.assign({},t);
  if(o.type==='daily'){o.type='rec';o.freq='day';o.every=1}
  else if(o.type==='weekdays'){o.type='rec';o.freq='week';o.days=[1,2,3,4,5]}
  else if(o.type==='weekly'){o.type='rec';o.freq='week'}
  else if(o.type==='everyN'){o.type='rec';o.freq='day';o.every=+o.n||2}
  if(o.type!=='rec')o.type='once';
  if(!o.duration)o.duration=OLD_MIN[+o.difficulty||3]||30;
  if(!o.effort)o.effort=+o.difficulty||3;
  if(o.desc==null)o.desc=o.notes||'';
  o.catIds=Array.isArray(o.catIds)?o.catIds:[];
  return o;
}

    works:!!p.work&&(p.workDays||[]).includes(dow),ws:toMin(p.workStart||'09:00'),we:toMin(p.workEnd||'17:30'),c:+p.commute||0};

function dueOn(t,date){
  if(t.type==='rec'){

    const d=parseYmd(date);
    if(t.freq==='week')return (t.days||[]).includes(d.getDay());
    if(t.freq==='month'){const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(+t.monthDay||1,last)}
    const n=Math.max(1,+t.every||1);const k=diffDays(t.start||date,date);return k>=0&&k%n===0;

  calls:{l:'Heures de bureau (appels, démarches)',from:540,to:1080}
};
const MOMENT_RULES=[
  ['evening',/\b(soiree|diner|apero|concert|boite|club|fete|teuf|spectacle|theatre|opera|karaoke|afterwork|bar)\b/],
  ['noon',/\b(dejeuner|brunch|pause dej)/],
  ['morning',/\b(petit[- ]?dej|footing|jogging|meditation|matinale)/],
  ['calls',/\b(appeler|telephoner|rappeler|prendre (un )?rdv|prendre rendez-vous)\b/],

const fitSlot=(ivs,t)=>{const w=winOf(t);for(const iv of ivs){const s=Math.max(iv[0],w[0]),e=Math.min(iv[1],w[1]);if(e-s>=t.duration)return [s,e]}return null};

const EVENT_RE=/\b(soiree|concert|spectacle|fete|anniversaire|mariage|match|festival|vernissage|theatre|opera|rdv|rendez-vous)\b/;

function generate(date,o){
  o=o||{};const pinned=o.pinned||[],skipped=o.skipped||[],exclude=o.exclude||new Set();
  const rule=(S.profile||{}).prioRule||'guaranteed';
  const di=dayInfo(date);
  const busy=[],items=[],used=new Set(pinned.map(i=>i.tid));
  if(di.works)busy.push([di.ws-di.c,di.we+di.c]);
  pinned.forEach(i=>{items.push(i);if(!i.w)busy.push([i.s,i.e+10])});
  const cands=S.tasks.filter(t=>!used.has(t.id)&&!skipped.includes(t.id)&&!exclude.has(t.id)&&!isDone(t,date)&&dueOn(t,date));
  cands.filter(t=>t.time).sort((a,b)=>toMin(a.time)-toMin(b.time)).forEach(t=>{
    const s=toMin(t.time),e=s+t.duration;items.push({tid:t.id,s,e});busy.push([s,e+10]);used.add(t.id);
  });
  let startDay=di.wake+30;const endDay=di.sleep-30;

    for(const iv of b){if(iv[0]>cur)out.push([cur,Math.min(iv[0],endDay)]);cur=Math.max(cur,iv[1])}

  const urgent=t=>rule!=='strict'&&((t.deadline&&diffDays(date,t.deadline)<=2)||(t.type==='once'&&t.date&&t.date<date));
  const cmp=(a,b)=>(urgent(b)-urgent(a))||(prio(catOf(b))-prio(catOf(a)))||((+b.priority||5)-(+a.priority||5))||((b.mandatory?1:0)-(a.mandatory?1:0))||String(a.deadline||'9').localeCompare(String(b.deadline||'9'));
  const rest=cands.filter(t=>!used.has(t.id)).sort(cmp);
  let order=rest;
  if(rule==='guaranteed'){
    const firsts=[],seen=new Set();
    rest.forEach(t=>{if(!seen.has(t.catId)){seen.add(t.catId);firsts.push(t)}});
    const urg=rest.filter(urgent);
    order=urg.concat(firsts.filter(t=>!urg.includes(t)),rest.filter(t=>!urg.includes(t)&&!firsts.includes(t)));
  }
  let heavy=items.filter(i=>{const t=taskById(i.tid);return t&&t.effort>=4}).length;
  let workSlots=items.filter(i=>i.w).length;const sel=[];
  for(const t of order){
    const d=t.duration,must=t.mandatory||urgent(t)||(t.type==='once'&&t.date===date);
    if(t.effort>=4&&heavy>=2&&!must)continue;
    if(t.atWork&&di.works&&workSlots<2&&d<=60){items.push({tid:t.id,s:di.ws,e:di.ws+d,w:true});workSlots++;used.add(t.id);continue}
    if(d+10>freeLeft)continue;
    if(!must&&budget<d)continue;
    sel.push(t);freeLeft-=d+10;if(!must)budget-=d;if(t.effort>=4)heavy++;
  }
  sel.sort(cmp).forEach(t=>{
    const slot=fitSlot(freeIntervals(),t);if(!slot)return;
    const s=slot[0],e=s+t.duration;items.push({tid:t.id,s,e});busy.push([s,e+10]);used.add(t.id);
  });
  items.sort((a,b)=>a.s-b.s);
  return {date,items,skipped};
}

/* Déplace une fois les données de l'espace privé (versions 1 à 4) vers l'espace de l'appli. */
async function migrate(old){
  try{
    const [ns,os]=await Promise.all([base.get(),old.get()]);
    if(ns.exists||!os.exists)return;
    $('#app').innerHTML='<div class="glass pad empty"><div class="logo"><i></i>Life</div><p class="muted">Déplacement de tes données…</p></div>';
    const moves=[['categories',catsRef],['tasks',tasksRef],['plans',plansRef]];
    const snaps=await Promise.all(moves.map(m=>old.collection(m[0]).get()));
    for(let k=0;k<moves.length;k++)for(const d of snaps[k].docs)await moves[k][1].doc(d.id).set(Object.assign({},d.data()));
    await base.set(Object.assign({},os.data()));
    for(let k=0;k<moves.length;k++)for(const d of snaps[k].docs)await old.collection(moves[k][0]).doc(d.id).delete();
    await old.delete();
  }catch(e){toast('Le déplacement de tes données n’a pas abouti. Recharge la page pour réessayer.')}
}

function buildTask(i,partial){
  const o={},dateOk=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));

  if(i.categoryId!=null){const k=String(i.categoryId).toLowerCase();const c=S.cats.find(x=>x.id===String(i.categoryId)||String(x.name).toLowerCase()===k);if(!c)throw new Error('Catégorie inconnue : utilise un id de la liste.');o.catId=c.id}

  if(i.date!==undefined)o.date=dateOk(i.date)?i.date:null;
  if(i.deadline!==undefined)o.deadline=dateOk(i.deadline)?i.deadline:null;
  if(i.time!==undefined)o.time=/^\d{1,2}:\d{2}$/.test(String(i.time||''))?String(i.time).padStart(5,'0'):null;
  if(i.duration_min!=null)o.duration=Math.min(600,Math.max(5,Math.round(+i.duration_min)||30));
  if(i.effort!=null)o.effort=Math.min(5,Math.max(1,Math.round(+i.effort)||2));
  if(i.priority!=null)o.priority=Math.min(10,Math.max(1,Math.round(+i.priority)||5));
  if(i.mandatory!=null)o.mandatory=!!i.mandatory;
  if(i.atWork!=null)o.atWork=!!i.atWork;
  if(i.freq!=null)o.freq=['day','week','month'].includes(i.freq)?i.freq:'day';
  if(i.every!=null)o.every=Math.max(1,Math.round(+i.every)||1);
  if(Array.isArray(i.days))o.days=i.days.map(Number).filter(n=>n>=0&&n<=6);
  if(i.monthDay!=null)o.monthDay=Math.min(31,Math.max(1,Math.round(+i.monthDay)||1));
  if(i.description!=null)o.desc=String(i.description).slice(0,2000);
  if(!partial){
    if(!o.title)throw new Error('Titre manquant.');if(!o.catId)throw new Error('Catégorie manquante.');
    const def={type:'once',duration:30,effort:2,priority:5,mandatory:false,atWork:false,catIds:[],desc:'',time:null,parentId:null,date:null,deadline:null,created:new Date().toISOString()};

  }
  return o;
}

async function sendChat(text){
  text=String(text||'').trim();if(!text||S.chatBusy)return;
  if(!S.sample){
    S.chat.push({role:'user',content:text});
    const m={id:'m'+Date.now().toString(36),role:'assistant',content:'Message transmis à Claude.',actions:[]};S.chat.push(m);saveChat();renderChatLog(true);
    const history=S.chat.slice(-12,-1).map(x=>(x.role==='user'?'Moi : ':'Life : ')+x.content).join('\n');
    try{await reqRef.doc().set({type:'chat',q:text,history,chatMsg:m.id,taskId:null,taskTitle:null,status:'pending',at:new Date().toISOString()})}
    catch(e){m.content='Message pas envoyé. Vérifie ta connexion et réessaie.';saveChat();renderChatLog(true)}
    return;
  }
  S.chat.push({role:'user',content:text});
  const msg={id:'m'+Date.now().toString(36),role:'assistant',content:'Life réfléchit…',actions:[]};S.chat.push(msg);
  S.chatBusy=true;renderChatLog(true);
  const ctl=new AbortController();S.chatCtl=ctl;
  let canTools=false;try{const lim=await S.sample.limits();canTools=!!(lim&&lim.tools)}catch(e){}
  const hist=S.chat.slice(0,-1).slice(-16).map(m=>({role:m.role,content:m.content||'…'}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const turns=[{role:'user',content:chatRules(canTools)}].concat(hist);
  const opts={signal:ctl.signal,modelTier:'quick',onText:({text})=>{msg.content=text;renderChatLog(true)}};
  if(canTools)opts.tools=chatTools(msg);else opts.cache=false;
  try{const r=await S.sample(turns,opts);msg.content=r.text}
  catch(e){
    const code=e&&e.code;const part=e&&e.text?e.text+'\n\n':'';
    msg.content=code==='cancelled'?(part||'')+'(arrêté)':part+(code==='not_granted'||code==='sampling_disabled'?'La discussion n’est pas autorisée sur ce compte.':code==='rate_limited'?'Trop de messages pour le moment. Réessaie un peu plus tard.':code==='refused'?'Je ne peux pas répondre à cette demande.':'Je n’ai pas pu répondre. Réessaie.');
  }finally{S.chatBusy=false;S.chatCtl=null;saveChat();renderChatLog(true)}
}

function b64uToBytes(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function checkPush(){
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();S.pushOn=!!sub;const el=$('#push-state');if(el)el.textContent=pushStateText()}catch(e){}
}
async function enablePush(btn){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast(pushStateText());return}
  btn.disabled=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notifications non autorisées.');return}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUBLIC)});
    const j=sub.toJSON();let h=0;for(const c of j.endpoint)h=(h*31+c.charCodeAt(0))>>>0;
    await db.collection('life/push').doc('d'+h.toString(36)).set({sub:j,device:navigator.userAgent.slice(0,120),at:new Date().toISOString()});
    S.pushOn=true;toast('Notifications activées.');
  }catch(e){toast('Activation impossible : '+(e&&e.message||'erreur'))}
  finally{btn.disabled=false;const el=$('#push-state');if(el)el.textContent=pushStateText()}
}
async function testPush(){
  try{await db.collection('life/pushqueue').doc().set({title:'Life',body:'Les notifications marchent 🎉',at:new Date().toISOString()});toast('Envoyée : elle arrive dans la minute.')}
  catch(e){toast('Pas envoyée. Réessaie.')}
}

/* ---------- Météo (Open-Meteo, gratuit) ---------- */
const WX=c=>c===0?['☀️','Ensoleillé']:c<=2?['🌤️','Peu nuageux']:c===3?['☁️','Couvert']:c<=48?['🌫️','Brouillard']:c<=57?['🌦️','Bruine']:c<=67?['🌧️','Pluie']:c<=77?['❄️','Neige']:c<=82?['🌧️','Averses']:c<=86?['🌨️','Averses de neige']:['⛈️','Orage'];
async function weather(){
  try{
    let lat=null,lon=null;
    try{const pos=await new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000,maximumAge:3600000}):rej());lat=pos.coords.latitude;lon=pos.coords.longitude}catch(e){}
    if(lat==null){
      const city=(S.profile&&S.profile.city)||'Paris';
      const g=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name='+encodeURIComponent(city))).json();
      if(!g.results||!g.results.length)return;lat=g.results[0].latitude;lon=g.results[0].longitude;
    }
    const w=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16')).json();
    const days={};(w.daily&&w.daily.time||[]).forEach((d,i)=>{days[d]={code:w.daily.weather_code[i],max:Math.round(w.daily.temperature_2m_max[i]),min:Math.round(w.daily.temperature_2m_min[i]),rain:w.daily.precipitation_probability_max[i]}});
    S.weather={now:w.current?{t:Math.round(w.current.temperature_2m),code:w.current.weather_code}:null,days};render();
  }catch(e){}
}
const wxDay=d=>S.weather&&S.weather.days[d];
function wxShort(d){const w=wxDay(d);return w?WX(w.code)[0]+' '+w.max+'°':''}

// Tâches ponctuelles dont la date est passée : Life demande ce qu'on en fait au lieu de les traîner.
function overdueCard(){
  const td=today();
  const late=S.tasks.filter(t=>t.type==='once'&&!t.done&&!t.abandoned&&t.date&&t.date<td).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  if(!late.length)return '';
  return '<div class="glass pad stack"><h3>On fait le point ?</h3>'+late.map(t=>{const ev=isEvent(t),c=catOf(t);
    return '<div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:8px"><div class="row"><span class="etile" style="--c:'+esc(c.color)+'">'+esc(c.emoji)+'</span><div style="flex:1;min-width:0"><b>'+esc(t.title)+'</b><div class="small muted">'+(ev?'C’était le '+esc(fmtShort(t.date))+'. Tu y es allée ?':'Prévue le '+esc(fmtShort(t.date))+', pas encore faite.')+'</div></div></div>'+

function viewCat(c){
  const ts=S.tasks.filter(t=>c.id?inCat(t,c.id):!S.cats.find(x=>x.id===t.catId));
  const open=ts.filter(t=>!(t.type==='once'&&(t.done||t.abandoned))),closed=ts.filter(t=>t.type==='once'&&(t.done||t.abandoned));
  const roots=open.filter(t=>!t.parentId||!open.find(x=>x.id===t.parentId)).sort((a,b)=>(+b.priority||5)-(+a.priority||5));
  const tree=roots.map(t=>listItem(t)+open.filter(x=>x.parentId===t.id).map(x=>listItem(x,true)).join('')).join('');
  return '<div><button class="link" data-act="backcats">‹ Toutes les catégories</button></div>'+
  '<section class="spread"><div class="row"><span class="etile" style="--c:'+esc(c.color)+';width:46px;height:46px;font-size:1.4rem">'+esc(c.emoji)+'</span><div><h1>'+esc(c.name)+'</h1>'+(c.desc?'<p class="muted small">'+esc(c.desc)+'</p>':'')+'</div></div><div><div class="big">'+esc(c.priority)+'</div><div class="small muted">priorité</div></div></section>'+
  '<div class="row"><button class="btn" data-act="new" data-cat="'+esc(c.id)+'">+ Créer une tâche</button>'+(c.id?'<button class="btn soft" data-act="editcat" data-id="'+esc(c.id)+'">Modifier la catégorie</button>':'')+'</div>'+
  '<div class="stack" style="gap:8px">'+(tree||'<div class="glass pad empty"><p class="muted">Aucune tâche en cours dans cette catégorie.</p></div>')+'</div>'+
  (closed.length?'<details><summary class="muted small">Terminées ('+closed.length+')</summary><div class="stack" style="gap:8px;margin-top:8px">'+closed.map(t=>listItem(t)).join('')+'</div></details>':'');
}
function listItem(t,isSub){

function viewHistory(){
  const ev=[];const from=addDays(today(),-60);
  S.tasks.forEach(t=>{if(t.type==='once'&&t.done)ev.push({d:t.doneDay||(t.doneAt||'').slice(0,10)||today(),t});else (t.doneDates||[]).forEach(d=>{if(d>=from)ev.push({d,t})})});

function calRange(){
  const a=S.cal.anchor;
  if(S.cal.mode==='week'){const m=mondayOf(a);return [m,addDays(m,6)]}
  const d=parseYmd(a);const first=ymd(new Date(d.getFullYear(),d.getMonth(),1));const last=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));
  return [mondayOf(first),addDays(mondayOf(last),6)];
}
function viewCal(){
  const [from,to]=calRange(),td=today();
  const fp=futurePlans(to>td?to:td);
  const days=[];for(let d=from;d<=to;d=addDays(d,1))days.push(d);
  const anchor=parseYmd(S.cal.anchor);
  const title=S.cal.mode==='week'?'Semaine du '+fmtShort(from)+' au '+fmtShort(to):anchor.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const head='<section class="stack" style="gap:6px"><p class="eyebrow">Calendrier</p><div class="spread"><h1 style="text-transform:capitalize">'+esc(title)+'</h1>'+
    '<div class="row"><button class="icon-btn" data-act="calnav" data-n="-1" aria-label="Précédent">‹</button><button class="btn soft" data-act="calnav" data-n="0">Aujourd’hui</button><button class="icon-btn" data-act="calnav" data-n="1" aria-label="Suivant">›</button></div></div>'+
    '<div class="seg" id="calmode"><button data-act="calmode" data-v="week" aria-pressed="'+(S.cal.mode==='week')+'">Semaine</button><button data-act="calmode" data-v="month" aria-pressed="'+(S.cal.mode==='month')+'">Mois</button></div>'+
    '<p class="small muted">Les jours à venir sont une prévision : Life fixe le planning le matin même.</p></section>';
  if(S.cal.mode==='week'){
    return head+'<div class="week">'+days.map(d=>{const pl=planOf(d,fp);
      const its=pl.items.map(i=>Object.assign({},i,{t:taskById(i.tid)})).filter(i=>i.t);
      return '<div class="glass day'+(d===td?' today':'')+'"><b class="small" style="text-transform:capitalize">'+esc(fmtWd(d))+(wxDay(d)?' '+wxShort(d):'')+'</b>'+
      (its.map(i=>{const c=catOf(i.t);return '<div class="it'+(isDone(i.t,d)?' done':'')+'" style="--c:'+esc(c.color)+'" data-act="open" data-id="'+esc(i.t.id)+'">'+(pl.history?'':esc(i.w?'💼':toHM(i.s))+' ')+esc(c.emoji)+' '+esc(i.t.title)+'</div>'}).join('')||'<span class="small muted">Libre</span>')+'</div>'}).join('')+'</div>';
  }
  const m=anchor.getMonth();

    desc:v('f-desc'),time:v('f-time')||null,parentId:v('f-parent')||null,moment:v('f-moment')||'auto'};

/* ---------- Actions ---------- */
async function toggleTask(id){
  const t=taskById(id);if(!t)return;const d=today();
  try{
    if(t.type==='once'){const on=!t.done;await tasksRef.doc(id).update({done:on,doneAt:on?new Date().toISOString():null,doneDay:on?d:null})}
    else{const arr=(t.doneDates||[]).filter(x=>x>=addDays(d,-90));const i=arr.indexOf(d);if(i>=0)arr.splice(i,1);else arr.push(d);await tasksRef.doc(id).update({doneDates:arr})}
  }catch(e){toast('Pas enregistré. Vérifie ta connexion et réessaie.')}
}
async function replaceTask(id){
  const d=today(),plan=S.plan;if(!plan)return;
  const item=plan.items.find(i=>i.tid===id),old=taskById(id);if(!item||!old)return;
  const inPlan=new Set(plan.items.map(i=>i.tid)),room=item.e-item.s+30;
  const fp=futurePlans(addDays(d,14));const later=[];const when={};
  Object.keys(fp).sort().filter(x=>x>d).forEach(x=>fp[x].items.forEach(i=>{const t=taskById(i.tid);if(t&&t.type==='once'&&!later.includes(t)){later.push(t);when[t.id]=x}}));
  S.tasks.filter(t=>t.type==='once'&&!t.done&&!inPlan.has(t.id)&&!later.includes(t)&&dueOn(t,d)).forEach(t=>later.push(t));
  const ok=t=>{const w=winOf(t);return !inPlan.has(t.id)&&!t.time&&!isEvent(t)&&t.duration<=room&&!(plan.skipped||[]).includes(t.id)&&item.s>=w[0]&&item.s+t.duration<=w[1]};
  const alt=later.find(t=>ok(t)&&t.effort===old.effort)||later.find(t=>ok(t)&&Math.abs(t.effort-old.effort)===1);
  if(!alt){toast('Aucune tâche d’effort similaire n’est prévue plus tard.');return}
  const items=plan.items.filter(i=>i.tid!==id).concat({tid:alt.id,s:item.s,e:item.s+alt.duration,w:!!item.w}).sort((a,b)=>a.s-b.s);
  try{
    await plansRef.doc(d).update({items,skipped:(plan.skipped||[]).concat(id)});
    if(old.type==='once'&&(!old.date||old.date<=d))await tasksRef.doc(id).update({date:when[alt.id]||addDays(d,1)});
    if(alt.date&&alt.date>d)await tasksRef.doc(alt.id).update({date:d});
    toast('Remplacée par « '+alt.title+' ».');
  }catch(e){toast('Pas enregistré. Réessaie dans un instant.')}
}
async function setBias(delta,noReplan){
  const b=Math.min(1.5,Math.max(0.6,(+((S.profile||{}).loadBias)||1)+delta));
  try{await base.update({loadBias:Math.round(b*100)/100});if(!noReplan){setTimeout(()=>replanToday(true),200);toast(delta>0?'Life ajoute un peu plus.':'Life allège ta journée.')}}catch(e){toast('Pas enregistré. Réessaie.')}
}
async function fillToday(cur,quiet){
  const d=today(),di=dayInfo(d);cur=cur||S.plan||{date:d,items:[],skipped:[]};
  const busy=[];if(di.works)busy.push([di.ws-di.c,di.we+di.c]);
  cur.items.forEach(i=>{if(!i.w)busy.push([i.s,i.e+10])});
  const inPlan=new Set(cur.items.map(i=>i.tid)),skipped=cur.skipped||[];
  const fp=futurePlans(addDays(d,30)),order=[];
  Object.keys(fp).sort().filter(x=>x>d).forEach(x=>fp[x].items.forEach(i=>{const t=taskById(i.tid);if(t&&t.type==='once'&&!order.includes(t))order.push(t)}));
  S.tasks.filter(t=>!order.includes(t)&&!isDone(t,d)&&(t.type==='once'||dueOn(t,d)))
    .sort((a,b)=>(prio(catOf(b))-prio(catOf(a)))||((+b.priority||5)-(+a.priority||5))).forEach(t=>order.push(t));
  const cands=order.filter(t=>!inPlan.has(t.id)&&!t.time&&!skipped.includes(t.id));
  const startDay=Math.max(di.wake+30,Math.ceil((nowMin()+5)/5)*5),endDay=di.sleep-30;
  const fi=()=>{const b=busy.slice().sort((x,y)=>x[0]-y[0]);const out=[];let c=startDay;
    for(const iv of b){if(iv[0]>c)out.push([c,Math.min(iv[0],endDay)]);c=Math.max(c,iv[1])}
    if(c<endDay)out.push([c,endDay]);return out.filter(iv=>iv[1]-iv[0]>=10)};
  const free=fi().reduce((a,iv)=>a+iv[1]-iv[0],0);
  const planned=cur.items.filter(i=>!i.w&&i.s>=startDay).reduce((a,i)=>{const t=taskById(i.tid);return a+(t&&!isDone(t,d)?i.e-i.s+10:0)},0);
  const cap=Math.max(0,0.75*(free+planned)-planned);let used=0;
  const items=cur.items.slice(),added=[];
  for(const t of cands){
    if(used+t.duration>cap)continue;
    const slot=fitSlot(fi(),t);if(!slot)continue;
    items.push({tid:t.id,s:slot[0],e:slot[0]+t.duration});busy.push([slot[0],slot[0]+t.duration+10]);used+=t.duration+10;added.push(t);
    if(added.length>=8)break;
  }
  if(!added.length)return 0;
  items.sort((a,b)=>a.s-b.s);
  await plansRef.doc(d).set({date:d,items,skipped,at:new Date().toISOString()});
  for(const t of added)if(t.type==='once'&&t.date!==d)await tasksRef.doc(t.id).update({date:d});
  return added.length;
}

async function split(id,btn){
  const t=taskById(id);if(!t||!S.sample)return;
  const box=$('#ai-steps');box.innerHTML='<p class="small muted">Life découpe ta tâche…</p>';btn.disabled=true;
  const td=today();
  const prompt='Tu aides une personne à s’organiser. Découpe la tâche "'+t.title+'" en 3 à 7 étapes progressives, réparties entre le '+td+' et la date limite du '+t.deadline+' (la dernière étape au plus tard la veille si possible). Description : '+(t.desc||'aucune')+'.\n'+
    'Réponds uniquement avec un tableau JSON d’objets {"title": string court en français, "date": "AAAA-MM-JJ", "minutes": durée entière, "effort": entier de 1 à 5}. Exemple : [{"title":"Rassembler les documents","date":"'+addDays(td,1)+'","minutes":30,"effort":2}]';
  try{
    const arr=await S.sample.json(prompt,{modelTier:'default'});
    const steps=(Array.isArray(arr)?arr:[]).filter(s=>s&&s.title).map(s=>({title:String(s.title).slice(0,140),
      date:(/^\d{4}-\d{2}-\d{2}$/.test(s.date)&&s.date>=td&&s.date<=t.deadline)?s.date:td,
      minutes:Math.min(240,Math.max(5,Math.round(+s.minutes)||30)),effort:Math.min(5,Math.max(1,Math.round(+s.effort)||2))}));
    if(!steps.length){box.innerHTML='<p class="small muted">Pas d’étapes proposées. Réessaie.</p>';return}
    split.steps=steps;split.parent=t;
    box.innerHTML='<div class="stack" style="gap:6px">'+steps.map((s,i)=>'<label class="toggle"><input type="checkbox" class="st" value="'+i+'" checked> <span><b>'+esc(fmtShort(s.date))+'</b> · '+esc(s.title)+' <span class="muted small">('+fmtDur(s.minutes)+')</span></span></label>').join('')+
      '</div><button class="btn" data-act="addsteps" style="margin-top:8px">Ajouter comme sous-tâches</button>';
  }catch(e){box.innerHTML='<p class="small muted">'+(e&&e.code==='rate_limited'?'Trop de demandes pour le moment. Réessaie plus tard.':'Le découpage n’a pas abouti. Réessaie.')+'</p>'}
  finally{btn.disabled=false}
}
